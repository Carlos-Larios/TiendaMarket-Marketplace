

<style>
  /* =====================================================
     STYLE / CONTENEDOR MODERNO DE PEDIDOS
     ===================================================== */

  .pedidos-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 20px;
    margin-bottom: 22px;
  }

  .pedidos-header h2 {
    font-size: 30px;
    margin-bottom: 6px;
  }

  .pedidos-header p {
    color: #94a3b8;
    font-size: 14px;
  }

  .pedido-contador {
    background: linear-gradient(135deg, #2563eb, #38bdf8);
    padding: 14px 18px;
    border-radius: 18px;
    font-weight: bold;
    box-shadow: 0 12px 30px rgba(37,99,235,.25);
    min-width: 150px;
    text-align: center;
  }

  .pedido-contador span {
    display: block;
    font-size: 26px;
  }

  /* =====================================================
     STYLE / FILTROS DE PEDIDOS
     ===================================================== */

  .filtros-pedidos {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1fr auto;
    gap: 12px;
    margin: 22px 0;
    background: rgba(15, 23, 42, .65);
    padding: 16px;
    border-radius: 18px;
    border: 1px solid rgba(255,255,255,.08);
  }

  .filtros-pedidos input,
  .filtros-pedidos select,
  .filtros-pedidos button {
    padding: 12px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,.08);
    background: #334155;
    color: white;
    outline: none;
  }

  .filtros-pedidos input:focus,
  .filtros-pedidos select:focus {
    border-color: #38bdf8;
    box-shadow: 0 0 0 3px rgba(56,189,248,.15);
  }

  .filtros-pedidos button {
    background: #3b82f6;
    cursor: pointer;
    font-weight: bold;
    transition: .25s;
  }

  .filtros-pedidos button:hover {
    background: #2563eb;
    transform: translateY(-1px);
  }

  /* =====================================================
     STYLE / TABLA MODERNA DE PEDIDOS
     ===================================================== */

  .tabla-wrapper {
    overflow-x: auto;
    border-radius: 18px;
    border: 1px solid rgba(255,255,255,.08);
    background: #0f172a;
  }

  .tabla-pedidos {
    width: 100%;
    border-collapse: collapse;
    min-width: 900px;
  }

  .tabla-pedidos thead {
    background: #020617;
  }

  .tabla-pedidos th {
    color: #38bdf8;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: .04em;
    padding: 15px;
    text-align: left;
    border-bottom: 1px solid #334155;
  }

  .tabla-pedidos td {
    padding: 15px;
    border-bottom: 1px solid rgba(255,255,255,.06);
    color: #e2e8f0;
    font-size: 14px;
  }

  .fila-pedido {
    cursor: pointer;
    transition: .25s;
  }

  .fila-pedido:hover {
    background: rgba(51, 65, 85, .75);
    transform: scale(1.002);
  }

  .codigo-pedido {
    color: #facc15;
    font-weight: bold;
  }

  .cliente-pedido {
    font-weight: bold;
    color: white;
  }

  .total-pedido {
    color: #22c55e;
    font-weight: bold;
  }

  .sin-resultados {
    text-align: center;
    padding: 28px !important;
    color: #94a3b8 !important;
  }

  /* =====================================================
     STYLE / ESTADOS DEL PEDIDO
     ===================================================== */

  .estado-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: bold;
    white-space: nowrap;
  }

  .estado-pendiente {
    background: rgba(245, 158, 11, .18);
    color: #fbbf24;
    border: 1px solid rgba(245,158,11,.35);
  }

  .estado-confirmado {
    background: rgba(14, 165, 233, .18);
    color: #38bdf8;
    border: 1px solid rgba(14,165,233,.35);
  }

  .estado-proveedor {
    background: rgba(34, 197, 94, .18);
    color: #22c55e;
    border: 1px solid rgba(34,197,94,.35);
  }

  .estado-importando {
    background: rgba(16, 185, 129, .18);
    color: #34d399;
    border: 1px solid rgba(16,185,129,.35);
  }

  .estado-preparando {
    background: rgba(59, 130, 246, .18);
    color: #60a5fa;
    border: 1px solid rgba(59,130,246,.35);
  }

  .estado-enviado {
    background: rgba(139, 92, 246, .18);
    color: #a78bfa;
    border: 1px solid rgba(139,92,246,.35);
  }

  .estado-entregado {
    background: rgba(22, 163, 74, .18);
    color: #4ade80;
    border: 1px solid rgba(22,163,74,.35);
  }

  .estado-cancelado {
    background: rgba(239, 68, 68, .18);
    color: #f87171;
    border: 1px solid rgba(239,68,68,.35);
  }

  .estado-devolucion {
    background: rgba(249, 115, 22, .18);
    color: #fb923c;
    border: 1px solid rgba(249,115,22,.35);
  }

  /* =====================================================
     STYLE / MODAL DE DETALLE DEL PEDIDO
     ===================================================== */

  .detalle-box {
    text-align: left;
    background: #0f172a;
    padding: 18px;
    border-radius: 16px;
    border: 1px solid #334155;
    max-height: 560px;
    overflow-y: auto;
  }

  .detalle-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 16px;
  }

  .detalle-card {
    background: #1e293b;
    padding: 13px;
    border-radius: 13px;
    border: 1px solid rgba(255,255,255,.08);
  }

  .detalle-card small {
    display: block;
    color: #94a3b8;
    margin-bottom: 4px;
    font-size: 12px;
  }

  .detalle-card strong {
    color: white;
    font-size: 14px;
    word-break: break-word;
  }

  .detalle-box h3 {
    color: #38bdf8;
    margin: 16px 0 10px;
  }

  .detalle-nota {
    background: #1e293b;
    padding: 13px;
    border-radius: 12px;
    margin-top: 6px;
    white-space: pre-wrap;
    border: 1px solid rgba(255,255,255,.08);
    color: #e2e8f0;
  }


  /* =====================================================
     STYLE / SEGUIMIENTO DEL PEDIDO
     ===================================================== */

  .seguimiento-pedido {
    background: rgba(15,23,42,.72);
    border: 1px solid rgba(56,189,248,.16);
    border-radius: 16px;
    padding: 14px;
    margin: 14px 0 18px;
  }

  .seguimiento-pedido h3 {
    margin-top: 0;
  }

  .seguimiento-layout {
    display: grid;
    grid-template-columns: 240px 1fr;
    gap: 14px;
    align-items: start;
    margin-top: 12px;
  }

  .acciones-izquierda-pedido {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .estado-dropdown {
    position: relative;
  }

  .btn-estado-principal {
    width: 100%;
    border: 1px solid rgba(56,189,248,.24);
    border-radius: 14px;
    padding: 12px 14px;
    background: linear-gradient(135deg, #1e293b, #0f172a);
    color: white;
    font-weight: 900;
    cursor: pointer;
    text-align: left;
  }

  .menu-estados-pedido {
    display: none;
    position: absolute;
    z-index: 50;
    top: calc(100% + 8px);
    left: 0;
    right: 0;
    background: #020617;
    border: 1px solid rgba(56,189,248,.22);
    border-radius: 14px;
    padding: 8px;
    box-shadow: 0 18px 45px rgba(0,0,0,.38);
  }

  .menu-estados-pedido.abierto {
    display: grid;
    gap: 7px;
  }

  .seguimiento-linea {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
  }

  .btn-seguimiento {
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 12px;
    padding: 10px 9px;
    background: #1e293b;
    color: #e2e8f0;
    font-weight: 800;
    cursor: pointer;
    transition: .2s;
    font-size: 12px;
  }

  .btn-seguimiento:hover {
    transform: translateY(-1px);
    border-color: #38bdf8;
    background: #334155;
  }

  .btn-seguimiento.activo {
    background: linear-gradient(135deg, #2563eb, #38bdf8);
    color: white;
    border-color: transparent;
  }

  .btn-proveedor {
    border: none;
    border-radius: 12px;
    padding: 11px 12px;
    background: #065f46;
    color: white;
    font-weight: 900;
    cursor: pointer;
  }

  .btn-facturar-pedido {
    border: none;
    border-radius: 12px;
    padding: 11px 12px;
    background: #2563eb;
    color: white;
    font-weight: 900;
    cursor: pointer;
  }

  .btn-devolucion {
    border: none;
    border-radius: 12px;
    padding: 11px 12px;
    background: #f97316;
    color: white;
    font-weight: 900;
    cursor: pointer;
  }

  .btn-cancelar-pedido {
    border: none;
    border-radius: 12px;
    padding: 11px 12px;
    background: #ef4444;
    color: white;
    font-weight: 900;
    cursor: pointer;
  }

  .nota-admin-area {
    width: 100%;
    min-height: 80px;
    margin-top: 10px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,.12);
    background: #0f172a;
    color: white;
    padding: 12px;
    resize: vertical;
    outline: none;
  }

  .btn-guardar-nota {
    width: auto;
    margin-top: 10px;
    border: none;
    border-radius: 12px;
    padding: 10px 14px;
    background: #22c55e;
    color: white;
    font-weight: bold;
    cursor: pointer;
  }

  @media(max-width: 900px) {
    .pedidos-header {
      flex-direction: column;
    }

    .filtros-pedidos {
      grid-template-columns: 1fr;
    }

    .detalle-grid {
      grid-template-columns: 1fr;
    }

    .seguimiento-layout {
      grid-template-columns: 1fr;
    }

    .seguimiento-linea {
      grid-template-columns: 1fr;
    }
  }

  /* =====================================================
     STYLE / PAGINACIÓN DE PEDIDOS
     ===================================================== */

  .pedidos-meta {
    display: flex;
    justify-content: flex-end;
    color: #94a3b8;
    font-size: 13px;
    margin: -8px 0 14px;
  }

  .paginacion-pedidos {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 14px;
    margin-top: 22px;
    flex-wrap: wrap;
  }

  .paginacion-pedidos button {
    width: auto;
    min-width: 120px;
    padding: 10px 16px;
    border: none;
    border-radius: 12px;
    background: rgba(59,130,246,.92);
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: .25s;
  }

  .paginacion-pedidos button:hover:not(:disabled) {
    background: #2563eb;
    transform: translateY(-1px);
  }

  .paginacion-pedidos button:disabled {
    opacity: .45;
    cursor: not-allowed;
    background: #475569;
  }

  .paginacion-pedidos span {
    color: #cbd5e1;
    font-weight: 700;
    background: rgba(15,23,42,.75);
    border: 1px solid rgba(255,255,255,.08);
    padding: 10px 14px;
    border-radius: 12px;
  }


  .sortable-th {
    cursor: pointer;
    user-select: none;
    position: relative;
    transition: .2s;
  }

  .sortable-th:hover {
    background: rgba(56,189,248,.12);
    color: #67e8f9;
  }

  .sortable-th .sort-icon {
    margin-left: 6px;
    color: #94a3b8;
    font-size: 11px;
  }

  .sortable-th.activo .sort-icon {
    color: #facc15;
  }


/* =====================================================
   STYLE / BUSCADOR + PANEL FLOTANTE DE FILTROS
   ===================================================== */
.modern-filter-toolbar {
  display: flex;
  justify-content: space-between;
  gap: 14px;
  padding: 16px;
  margin: 22px 0;
  background: rgba(30, 41, 59, 0.76);
  border: 1px solid rgba(148, 163, 184, 0.18);
  border-radius: 18px;
  box-shadow: 0 18px 40px rgba(0, 0, 0, 0.22);
}

.modern-filter-toolbar .search-box {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(15, 23, 42, 0.78);
  border: 1px solid rgba(148, 163, 184, 0.18);
  border-radius: 14px;
  padding: 0 14px;
}

.modern-filter-toolbar .search-box input {
  width: 100%;
  border: none !important;
  background: transparent !important;
  color: #f8fafc;
  padding: 12px 0;
  outline: none;
}

.modern-filter-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.btn-modern-filter {
  border: none;
  border-radius: 13px;
  padding: 12px 18px;
  font-weight: 800;
  cursor: pointer;
  transition: transform .15s ease, opacity .15s ease;
  color: #e0f2fe;
  background: rgba(14, 165, 233, 0.22);
  border: 1px solid rgba(56, 189, 248, 0.35);
}

.btn-modern-filter:hover {
  transform: translateY(-1px);
  opacity: .92;
}

.modern-filters-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(2, 6, 23, 0.55);
  z-index: 90;
}

.modern-filters-overlay.activo {
  display: block;
}

.modern-filters-panel {
  position: fixed;
  top: 0;
  right: -390px;
  width: 370px;
  height: 100vh;
  background: #0f172a;
  border-left: 1px solid rgba(148, 163, 184, .2);
  box-shadow: -20px 0 50px rgba(0, 0, 0, .35);
  z-index: 100;
  padding: 22px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  transition: right .25s ease;
  overflow-y: auto;
}

.modern-filters-panel.abierto {
  right: 0;
}

.modern-filters-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.modern-filters-header h3 {
  color: #f8fafc;
  margin: 0;
}

.modern-filters-panel label {
  color: #cbd5e1;
  font-weight: 700;
  font-size: 14px;
  margin-top: 6px;
}

.modern-filters-panel input,
.modern-filters-panel select {
  width: 100%;
  background: rgba(15, 23, 42, 0.9);
  color: #f8fafc;
  border: 1px solid rgba(148, 163, 184, 0.24);
  border-radius: 12px;
  padding: 12px 14px;
  outline: none;
}

.modern-filters-actions {
  display: flex;
  gap: 10px;
  margin-top: 16px;
}

.modern-filters-actions button {
  flex: 1;
}

.btn-modern-secondary {
  border: none;
  border-radius: 13px;
  padding: 12px 18px;
  font-weight: 800;
  cursor: pointer;
  color: #f8fafc;
  background: rgba(100, 116, 139, 0.5);
}

.btn-modern-primary {
  border: none;
  border-radius: 13px;
  padding: 12px 18px;
  font-weight: 800;
  cursor: pointer;
  color: #082f49;
  background: linear-gradient(135deg, #22d3ee, #60a5fa);
}

.btn-modern-close {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  border: none;
  color: #f8fafc;
  background: rgba(148, 163, 184, .18);
  font-size: 22px;
  cursor: pointer;
}

@media (max-width: 760px) {
  .modern-filter-toolbar {
    flex-direction: column;
  }

  .modern-filter-actions {
    width: 100%;
  }

  .modern-filter-actions button,
  .modern-filter-actions .btn-productos {
    flex: 1;
  }

  .modern-filters-panel {
    width: 100%;
    right: -100%;
  }
}


/* =====================================================
   STYLE / MODAL FUTURISTA DE PEDIDOS V3
   ===================================================== */
.swal2-popup.pedido-detalle-modal {
  padding: 0 !important;
  border-radius: 28px !important;
  overflow: hidden !important;
  border: 1px solid rgba(56, 189, 248, .20) !important;
  background: #020617 !important;
  box-shadow: 0 36px 110px rgba(0,0,0,.68), 0 0 0 1px rgba(14,165,233,.08) inset !important;
}

.swal2-popup.pedido-detalle-modal .swal2-html-container {
  margin: 0 !important;
  padding: 0 !important;
  overflow: visible !important;
}

.swal2-popup.pedido-detalle-modal .swal2-actions {
  margin: 0 !important;
  padding: 14px 24px 22px !important;
  background: #020617;
  border-top: 1px solid rgba(56,189,248,.10);
}

.pedido-modal-v2 {
  position: relative;
  text-align: left;
  color: #e2e8f0;
  max-height: 80vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  background:
    radial-gradient(circle at 8% 0%, rgba(56,189,248,.18), transparent 30%),
    radial-gradient(circle at 92% 12%, rgba(99,102,241,.14), transparent 34%),
    linear-gradient(180deg, #020617 0%, #07111f 45%, #020617 100%);
  animation: pedidoModalIn .22s ease both;
}

.pedido-modal-v2::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background-image:
    linear-gradient(rgba(56,189,248,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(56,189,248,.035) 1px, transparent 1px);
  background-size: 34px 34px;
  opacity: .55;
}

@keyframes pedidoModalIn {
  from { opacity: 0; transform: translateY(10px) scale(.985); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.pedido-modal-header-v2 {
  position: sticky;
  top: 0;
  z-index: 4;
  display: flex;
  justify-content: space-between;
  gap: 18px;
  align-items: center;
  padding: 24px;
  background:
    linear-gradient(135deg, rgba(2,6,23,.96), rgba(15,23,42,.92)),
    radial-gradient(circle at top left, rgba(34,211,238,.24), transparent 42%);
  border-bottom: 1px solid rgba(56,189,248,.18);
  box-shadow: 0 18px 50px rgba(0,0,0,.22);
}

.pedido-modal-title-v2 h2 {
  margin: 0 0 8px;
  font-size: 25px;
  color: #f8fafc;
  letter-spacing: -.03em;
}

.pedido-modal-title-v2 p {
  margin: 0;
  color: #94a3b8;
  font-size: 13px;
}

.pedido-modal-summary-v2 {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: flex-end;
}

.pedido-total-pill-v2 {
  background: linear-gradient(135deg, rgba(34,197,94,.18), rgba(20,184,166,.16));
  color: #86efac;
  border: 1px solid rgba(34,197,94,.36);
  border-radius: 999px;
  padding: 10px 15px;
  font-weight: 950;
  box-shadow: 0 0 24px rgba(34,197,94,.12);
  white-space: nowrap;
}

.pedido-content-v2 {
  position: relative;
  z-index: 1;
  padding: 22px 24px 24px;
  overflow-y: auto;
}

.pedido-content-v2::-webkit-scrollbar,
.pedido-modal-v2 *::-webkit-scrollbar {
  width: 9px;
  height: 9px;
}

.pedido-content-v2::-webkit-scrollbar-thumb,
.pedido-modal-v2 *::-webkit-scrollbar-thumb {
  background: rgba(56,189,248,.28);
  border-radius: 999px;
}

.pedido-section-title-v2 {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 22px 0 13px;
}

.pedido-section-title-v2 h3 {
  margin: 0;
  color: #67e8f9;
  font-size: 17px;
  letter-spacing: -.01em;
  text-shadow: 0 0 18px rgba(103,232,249,.16);
}

.pedido-section-title-v2::after {
  content: "";
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, rgba(56,189,248,.35), transparent);
}

.pedido-info-grid-v2 {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 13px;
}

.pedido-card-v2,
.pedido-note-v2,
.pedido-actions-v2,
.pedido-product-card-v2 {
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}

.pedido-card-v2 {
  position: relative;
  background: linear-gradient(145deg, rgba(15,23,42,.82), rgba(30,41,59,.54));
  border: 1px solid rgba(148,163,184,.16);
  border-radius: 18px;
  padding: 15px;
  min-height: 78px;
  overflow: hidden;
  transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
}

.pedido-card-v2::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: linear-gradient(135deg, rgba(56,189,248,.13), transparent 45%);
  opacity: 0;
  transition: .18s;
  pointer-events: none;
}

.pedido-card-v2:hover,
.pedido-product-card-v2:hover,
.pedido-note-v2:hover {
  transform: translateY(-2px);
  border-color: rgba(56,189,248,.34);
  box-shadow: 0 18px 45px rgba(8,47,73,.18);
}

.pedido-card-v2:hover::before { opacity: 1; }

.pedido-card-v2 small {
  display: block;
  color: #94a3b8;
  font-size: 12px;
  margin-bottom: 8px;
  font-weight: 800;
}

.pedido-card-v2 strong,
.pedido-card-v2 span {
  color: #f8fafc;
  font-weight: 900;
  word-break: break-word;
  line-height: 1.35;
}

.pedido-actions-v2 {
  display: grid;
  grid-template-columns: 220px 1fr;
  gap: 16px;
  align-items: start;
  background: linear-gradient(135deg, rgba(15,23,42,.78), rgba(2,6,23,.54));
  border: 1px solid rgba(56,189,248,.18);
  border-radius: 20px;
  padding: 16px;
  box-shadow: 0 18px 50px rgba(0,0,0,.18) inset;
}

.pedido-action-buttons-v2 {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* =====================================================
   FIX / PEDIDOS RESPONSIVE COMO FACTURACIÓN
   En PC la tabla ocupa todo el ancho.
   En móvil se mantiene como tabla y se desliza horizontalmente.
   ===================================================== */
.tabla-wrapper {
  width: 100%;
  max-width: 100%;
  overflow-x: auto !important;
  overflow-y: hidden;
  -webkit-overflow-scrolling: touch;
  border-radius: 18px;
  background: #0f172a;
}

.tabla-pedidos {
  width: 100% !important;
  min-width: 1080px;
  border-collapse: collapse !important;
  table-layout: auto;
}

.tabla-pedidos thead {
  display: table-header-group !important;
}

.tabla-pedidos tbody {
  display: table-row-group !important;
}

.tabla-pedidos tr,
.tabla-pedidos .fila-pedido {
  display: table-row !important;
}

.tabla-pedidos th,
.tabla-pedidos td {
  display: table-cell !important;
  white-space: nowrap !important;
}

.tabla-pedidos td::before,
.tabla-pedidos td::after {
  content: none !important;
  display: none !important;
}

@media (max-width: 760px) {
  .tabla-wrapper {
    overflow-x: auto !important;
  }

  .tabla-pedidos {
    width: max-content !important;
    min-width: 1080px !important;
  }

  .tabla-pedidos tr,
  .tabla-pedidos .fila-pedido {
    display: table-row !important;
    margin: 0 !important;
    padding: 0 !important;
    border-radius: 0 !important;
    background: transparent;
  }

  .tabla-pedidos th,
  .tabla-pedidos td {
    width: auto !important;
    padding: 15px !important;
    text-align: left !important;
    border-bottom: 1px solid rgba(255,255,255,.06) !important;
  }

  .tabla-pedidos td[data-label] {
    display: table-cell !important;
  }

  .tabla-pedidos td[data-label]::before {
    content: none !important;
    display: none !important;
  }
}

.btn-copiar-codigo {
  width: 26px;
  height: 26px;
  border: 1px solid rgba(56,189,248,.26);
  border-radius: 9px;
  display: inline-grid;
  place-items: center;
  background: rgba(14,165,233,.10);
  color: #7dd3fc;
  cursor: pointer;
  opacity: 0;
  transform: translateX(-5px) scale(.94);
  transition: opacity .18s ease, transform .18s ease, background .18s ease, border-color .18s ease, color .18s ease;
  font-size: 13px;
  line-height: 1;
}

.codigo-pedido:hover .btn-copiar-codigo,
.btn-copiar-codigo:focus-visible {

  transform: translateX(0) scale(1);
}

.btn-copiar-codigo:hover {
  background: rgba(56,189,248,.20);
  border-color: rgba(56,189,248,.52);
  color: #e0f2fe;
  box-shadow: 0 0 18px rgba(56,189,248,.18);
}

  transform: translateX(0) scale(1);
  color: #86efac;
  background: rgba(34,197,94,.16);
  border-color: rgba(34,197,94,.38);
}

.toast-codigo-copiado {
  position: fixed;
  top: 22px;
  right: 22px;
  z-index: 99999;
  min-width: 250px;
  max-width: min(360px, calc(100vw - 32px));
  padding: 13px 15px;
  border-radius: 16px;
  background: linear-gradient(135deg, rgba(15,23,42,.96), rgba(30,41,59,.94));
  border: 1px solid rgba(56,189,248,.28);
  box-shadow: 0 20px 50px rgba(0,0,0,.38), 0 0 28px rgba(56,189,248,.12);
  color: #e2e8f0;
  opacity: 0;
  transform: translateY(-10px) scale(.98);
  pointer-events: none;
  transition: opacity .18s ease, transform .18s ease;
}

.toast-codigo-copiado.visible {
  opacity: 1;
  transform: translateY(0) scale(1);
}

.toast-codigo-copiado strong {
  display: block;
  color: #86efac;
  font-size: 13px;
  margin-bottom: 3px;
}

.toast-codigo-copiado span {

<script>
var pedidosToken = localStorage.getItem("token");

if (!pedidosToken) {
  window.location.href = "login-Panel.html";
}
</script>
<script type="module">
  import axios from "https://cdn.jsdelivr.net/npm/axios@1.7.7/+esm";

  const API = "http://localhost:3000/api";
  const PEDIDOS_SCOPE = window.TIENDAPRO_PEDIDOS_SCOPE || "";

const authHeaders = {
  headers: {
    Authorization: `Bearer ${pedidosToken}`
  }
};

function logout() {
  localStorage.removeItem("token");
  localStorage.removeItem("usuario");

  window.location.href = "login-Panel.html";
}

  /* =====================================================
     JAVASCRIPT / VARIABLES GLOBALES
     ===================================================== */

  let pedidosGlobales = [];
  window.pedidosDetallePdfCache = window.pedidosDetallePdfCache || new Map();

  let paginaActual = 1;
  const limitePedidos = 20;
  let totalPedidosActual = 0;
  let totalPaginasActual = 1;
  let busquedaActual = "";
  let estadoActual = "";
  let metodoPagoActual = "";
  let fechaActual = "";
  let ordenCampoPedidos = "";
  let ordenDireccionPedidos = "asc";
  let destinoPendientePedidosProcesado = false;


  const buscarPedido = document.getElementById("buscarPedido");
  const filtroEstadoPedido = document.getElementById("filtroEstadoPedido");
  const filtroPagoPedido = document.getElementById("filtroPagoPedido");
  const filtroFechaPedido = document.getElementById("filtroFechaPedido");
  const limpiarFiltrosPedidos = document.getElementById("limpiarFiltrosPedidos");
  const contadorPedidos = document.getElementById("contadorPedidos");

  /* =====================================================
     JAVASCRIPT / FUNCIONES DE AYUDA
     ===================================================== */

  function normalizarTexto(texto) {
    return (texto || "")
      .toString()
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .trim();
  }

  function claseEstado(estado) {
    const estadoNormalizado = normalizarTexto(estado);

    if (estadoNormalizado === "pendiente") return "estado-pendiente";
    if (estadoNormalizado === "confirmado") return "estado-confirmado";
    if (estadoNormalizado === "pedido al proveedor") return "estado-proveedor";
    if (estadoNormalizado === "importando") return "estado-importando";
    if (estadoNormalizado === "preparando") return "estado-preparando";
    if (estadoNormalizado === "enviado") return "estado-enviado";
    if (estadoNormalizado === "entregado") return "estado-entregado";
    if (estadoNormalizado === "devolucion solicitada") return "estado-devolucion";
    if (estadoNormalizado === "devuelto") return "estado-devolucion";
    if (estadoNormalizado === "cancelado") return "estado-cancelado";

    return "estado-pendiente";
  }

  function formatearFecha(fecha) {
    if (!fecha) return "Sin fecha";

    const texto = fecha.toString().trim();
    const partes = texto.replace("T", " ").split(" ");
    const soloFecha = partes[0] || "";
    const hora = partes[1] ? partes[1].slice(0, 8) : "";
    const fechaPartes = soloFecha.split("-");

    if (fechaPartes.length === 3) {
      const [anio, mes, dia] = fechaPartes;
      return `${dia}/${mes}/${anio}${hora ? " " + hora : ""}`;
    }

    return texto.replace("T", " ").slice(0, 19);
  }

  function iconoEstado(estado) {
    const e = normalizarTexto(estado);
    if (e === "pendiente") return "🟡";
    if (e === "confirmado") return "✅";
    if (e === "pedido al proveedor") return "🛒";
    if (e === "importando") return "🌎";
    if (e === "preparando") return "📦";
    if (e === "enviado") return "🚚";
    if (e === "entregado") return "✅";
    if (e === "devolucion solicitada") return "↩️";
    if (e === "devuelto") return "📥";
    if (e === "cancelado") return "🔴";
    return "🟡";
  }


  function pedidoTieneImportacion(pedido) {
    const tipo = normalizarTexto(pedido.tipo_pedido || pedido.tipo_venta || "");
    const resumen = normalizarTexto(pedido.resumen_pedido || "");

    return (
      tipo.includes("import") ||
      tipo.includes("bajo") ||
      resumen.includes("bajo_pedido") ||
      resumen.includes("importacion") ||
      resumen.includes("importando")
    );
  }

  function estadosDisponiblesPedido(pedido) {
    if (pedidoTieneImportacion(pedido)) {
      return ["Confirmado", "Importando", "Preparando", "Enviado", "Entregado"];
    }

    return ["Confirmado", "Preparando", "Enviado", "Entregado"];
  }

  window.toggleMenuEstadosPedido = function(id) {
    const menu = document.getElementById(`menuEstadosPedido-${id}`);
    if (!menu) return;

    document.querySelectorAll('.menu-estados-pedido.abierto').forEach(item => {
      if (item !== menu) item.classList.remove('abierto');
    });

    menu.classList.toggle("abierto");
  };

  function valorOrdenPedido(pedido, campo) {
    if (campo === "id") return Number(pedido.id || 0);
    if (campo === "total") return Number(pedido.total || 0);
    if (campo === "fecha_pedido") return new Date(pedido.fecha_pedido || 0).getTime();
    return normalizarTexto(pedido[campo] || "");
  }

  function ordenarPedidosLista(pedidos) {
    if (!ordenCampoPedidos) return [...pedidos];

    return [...pedidos].sort((a, b) => {
      const va = valorOrdenPedido(a, ordenCampoPedidos);
      const vb = valorOrdenPedido(b, ordenCampoPedidos);

      if (typeof va === "number" && typeof vb === "number") {
        return ordenDireccionPedidos === "asc" ? va - vb : vb - va;
      }

      return ordenDireccionPedidos === "asc"
        ? String(va).localeCompare(String(vb), "es")
        : String(vb).localeCompare(String(va), "es");
    });
  }

  function actualizarIconosOrdenPedidos() {
    document.querySelectorAll(".tabla-pedidos .sortable-th").forEach(th => {
      const icon = th.querySelector(".sort-icon");
      const activo = th.dataset.sort === ordenCampoPedidos;
      th.classList.toggle("activo", activo);
      if (icon) icon.textContent = activo ? (ordenDireccionPedidos === "asc" ? "▲" : "▼") : "↕";
    });
  }

  document.querySelectorAll(".tabla-pedidos .sortable-th").forEach(th => {
    th.addEventListener("click", () => {
      const campo = th.dataset.sort;
      if (ordenCampoPedidos === campo) {
        ordenDireccionPedidos = ordenDireccionPedidos === "asc" ? "desc" : "asc";
      } else {
        ordenCampoPedidos = campo;
        ordenDireccionPedidos = campo === "id" || campo === "fecha_pedido" || campo === "total" ? "desc" : "asc";
      }
      mostrarPedidos(pedidosGlobales);
    });
  });


function obtenerDestinoPendienteVista(vista, acciones = []) {
  let destino = window.TIENDAPRO_DESTINO_PENDIENTE || null;
  if (!destino) {
    try { destino = JSON.parse(localStorage.getItem('tiendapro_destino_pendiente') || 'null'); } catch { destino = null; }
  }
  if (!destino) return null;
  if (vista && destino.vista && destino.vista !== vista) return null;
  if (acciones.length && !acciones.includes(destino.accion)) return null;
  return destino;
}
function limpiarDestinoPendienteVista() {
  window.TIENDAPRO_DESTINO_PENDIENTE = null;
  try { localStorage.removeItem('tiendapro_destino_pendiente'); } catch {}
}
function resaltarRegistroPendiente(selector) {
  const el = document.querySelector(selector);
  if (!el) return;
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  el.style.outline = '2px solid #38bdf8';
  el.style.boxShadow = '0 0 0 6px rgba(56,189,248,.16)';
  setTimeout(() => { el.style.outline = ''; el.style.boxShadow = ''; }, 2400);
}

  async function procesarDestinoPendientePedidos() {
    if (destinoPendientePedidosProcesado) return;
    const destino = obtenerDestinoPendienteVista('pedidos_view.html');
    if (!destino) return;
    destinoPendientePedidosProcesado = true;
    const registro = String(destino.registro || destino.idVisible || '').trim();
    const soloFiltrarDestino = destino.soloFiltrar === true || destino.abrirDetalle === false || destino.accion === 'filtrarRegistro';
    if (!registro) return limpiarDestinoPendienteVista();

    let pedido = pedidosGlobales.find(p => String(p.id) === registro || normalizarTexto(p.codigo_pedido || '') === normalizarTexto(registro));
    if (!pedido) {
      try {
        busquedaActual = registro;
        if (buscarPedido) buscarPedido.value = registro;
        paginaActual = 1;
        const params = new URLSearchParams({ page: 1, limit: limitePedidos, search: registro, estado: estadoActual, metodo_pago: metodoPagoActual, fecha: fechaActual });
        if (PEDIDOS_SCOPE) params.set('scope', PEDIDOS_SCOPE);
        const res = await axios.get(`${API}/pedidos?${params.toString()}`, authHeaders);
        pedidosGlobales = Array.isArray(res.data.pedidos) ? res.data.pedidos : [];
        totalPedidosActual = Number(res.data.total || pedidosGlobales.length);
        totalPaginasActual = Number(res.data.totalPaginas || 1);
        mostrarPedidos(pedidosGlobales);
        renderizarPaginacionPedidos();
        pedido = pedidosGlobales.find(p => String(p.id) === registro || normalizarTexto(p.codigo_pedido || '') === normalizarTexto(registro)) || pedidosGlobales[0];
      } catch (error) { console.error('No se pudo preparar el pedido buscado:', error); }
    }

    if (pedido) {
      limpiarDestinoPendienteVista();
      setTimeout(() => {
        resaltarRegistroPendiente(`[data-pedido-id="${pedido.id}"]`);
        if (!soloFiltrarDestino) window.verDetallePedido(Number(pedido.id));
      }, 260);
    } else {
      limpiarDestinoPendienteVista();
    }
  }

  /* =====================================================
     JAVASCRIPT / CARGAR PEDIDOS DESDE EL BACKEND
     ===================================================== */

  async function cargarPedidos() {
    try {
      const params = new URLSearchParams({
        page: paginaActual,
        limit: limitePedidos,
        search: busquedaActual,
        estado: estadoActual,
        metodo_pago: metodoPagoActual,
        fecha: fechaActual
      });

      if (PEDIDOS_SCOPE) params.set("scope", PEDIDOS_SCOPE);

      const res = await axios.get(`${API}/pedidos?${params.toString()}`, authHeaders);

      pedidosGlobales = Array.isArray(res.data.pedidos) ? res.data.pedidos : [];
      totalPedidosActual = Number(res.data.total || pedidosGlobales.length);
      totalPaginasActual = Number(res.data.totalPaginas || 1);

      mostrarPedidos(pedidosGlobales);
      renderizarPaginacionPedidos();
      setTimeout(procesarDestinoPendientePedidos, 120);

    } catch (error) {
      console.log(error);

      Swal.fire({
        title: "Error",
        text: "No se pudieron cargar los pedidos",
        icon: "error",
        background: "#1e293b",
        color: "white"
      });
    }
  }

  /* =====================================================
     JAVASCRIPT / MOSTRAR PEDIDOS EN TABLA
     ===================================================== */

  function mostrarPedidos(pedidos) {
    const tabla = document.getElementById("tablaPedidos");

    contadorPedidos.innerText = totalPedidosActual;
    tabla.innerHTML = "";

    if (pedidos.length === 0) {
      tabla.innerHTML = `
        <tr>
          <td colspan="9" class="sin-resultados">
            No hay pedidos que coincidan con los filtros
          </td>
        </tr>
      `;
      return;
    }

    const pedidosOrdenados = ordenarPedidosLista(pedidos);
    actualizarIconosOrdenPedidos();

    pedidosOrdenados.forEach((pedido) => {
      tabla.innerHTML += `
        <tr 
          class="fila-pedido" 
          data-pedido-id="${pedido.id}"
          onclick="verDetallePedido(${pedido.id})"
          title="Haz clic para ver todos los detalles del pedido"
        >
          <td data-label="ID">#${pedido.id}</td>

          <td data-label="Código" class="codigo-pedido">
            <span class="codigo-copy-wrap">
              <span class="codigo-texto">${pedido.codigo_pedido || "Sin código"}</span>
              ${pedido.codigo_pedido ? `
                <button
                  type="button"
                  class="btn-copiar-codigo"
                  title="Copiar código"
                  aria-label="Copiar código ${escaparHtml(pedido.codigo_pedido)}"
                  onclick="copiarCodigoPedido(event, '${escaparHtml(pedido.codigo_pedido)}')"
                >
                  <span class="copy-icon">⧉</span>
                </button>
              ` : ""}
            </span>
          </td>

          <td data-label="Cliente" class="cliente-pedido">
            ${pedido.cliente || "Cliente no registrado"}
          </td>

          <td data-label="Tiendas">${pedido.tiendas_pedido || "Mi tienda"}</td>

          <td data-label="Total" class="total-pedido">
            $${Number(pedido.total || 0).toFixed(2)}
          </td>

          <td data-label="Estado">
            <span class="estado-badge ${claseEstado(pedido.estado)}">
              ${iconoEstado(pedido.estado)} ${pedido.estado || "Pendiente"}
            </span>
          </td>

          <td data-label="Método pago">${pedido.metodo_pago || "No especificado"}</td>

          <td data-label="Teléfono">${pedido.telefono || "Sin teléfono"}</td>

          <td data-label="Fecha">${formatearFecha(pedido.fecha_pedido)}</td>
        </tr>
      `;
    });
  }

  /* =====================================================
     JAVASCRIPT / FILTROS DE PEDIDOS
     ===================================================== */

  function renderizarPaginacionPedidos() {
    const paginacion = document.getElementById("paginacionPedidos");
    const infoPedidos = document.getElementById("infoPedidos");

    if (infoPedidos) {
      const inicio = totalPedidosActual === 0 ? 0 : ((paginaActual - 1) * limitePedidos) + 1;
      const fin = Math.min(paginaActual * limitePedidos, totalPedidosActual);

      infoPedidos.innerText = `Mostrando ${inicio}-${fin} de ${totalPedidosActual} pedidos`;
    }

    if (!paginacion) return;

    if (totalPaginasActual <= 1) {
      paginacion.innerHTML = "";
      return;
    }

    paginacion.innerHTML = `
      <button ${paginaActual <= 1 ? "disabled" : ""} onclick="cambiarPaginaPedidos(${paginaActual - 1})">
        ← Anterior
      </button>

      <span>Página ${paginaActual} de ${totalPaginasActual}</span>

      <button ${paginaActual >= totalPaginasActual ? "disabled" : ""} onclick="cambiarPaginaPedidos(${paginaActual + 1})">
        Siguiente →
      </button>
    `;
  }

  window.cambiarPaginaPedidos = function(nuevaPagina) {
    if (nuevaPagina < 1 || nuevaPagina > totalPaginasActual) return;

    paginaActual = nuevaPagina;
    cargarPedidos();
  };

  function escaparHtml(valor = "") {
    return String(valor ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  function mostrarToastCodigoCopiado(codigo) {
    let toast = document.getElementById("toastCodigoCopiado");

    if (!toast) {
      toast = document.createElement("div");
      toast.id = "toastCodigoCopiado";
      toast.className = "toast-codigo-copiado";
      document.body.appendChild(toast);
    }

    toast.innerHTML = `
      <strong>✓ Código copiado</strong>
      <span>${escaparHtml(codigo)}</span>
    `;

    toast.classList.add("visible");
    clearTimeout(window.toastCodigoCopiadoTimer);
    window.toastCodigoCopiadoTimer = setTimeout(() => {
      toast.classList.remove("visible");
    }, 2000);
  }

  window.copiarCodigoPedido = async function(event, codigo) {
    if (event) {
      event.preventDefault();
      event.stopPropagation();
    }

    const texto = String(codigo || "").trim();
    if (!texto || texto === "Sin código") return;

    const boton = event?.currentTarget || null;
    const icono = boton?.querySelector(".copy-icon");
    const iconoOriginal = icono ? icono.textContent : "⧉";

    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(texto);
      } else {
        const inputTemporal = document.createElement("textarea");
        inputTemporal.value = texto;
        inputTemporal.setAttribute("readonly", "");
        inputTemporal.style.position = "fixed";
        inputTemporal.style.left = "-9999px";
        document.body.appendChild(inputTemporal);
        inputTemporal.select();
        document.execCommand("copy");
        document.body.removeChild(inputTemporal);
      }

      if (boton) boton.classList.add("copiado");
      if (icono) icono.textContent = "✓";
      mostrarToastCodigoCopiado(texto);

      setTimeout(() => {
        if (boton) boton.classList.remove("copiado");
        if (icono) icono.textContent = iconoOriginal;
      }, 1000);
    } catch (error) {
      console.log("No se pudo copiar el código:", error);
      Swal.fire({
        title: "No se pudo copiar",
        text: "Copia el código manualmente: " + texto,
        icon: "warning",
        background: "#1e293b",
        color: "white"
      });
    }
  };

    try {

      const pedido = detalleRes.data?.pedido || {};
      const detalles = Array.isArray(detalleRes.data?.detalles) ? detalleRes.data.detalles : [];

      if (normalizarTexto(pedido.estado) !== "entregado") {
        Swal.fire({
          title: "No permitido",
          text: "Solo se puede crear devolución cuando el pedido está Entregado.",
          icon: "warning",
          background: "#1e293b",
          color: "white"
        });
        return;
      }

      if (detalles.length === 0) {
        Swal.fire({
          title: "Sin productos",
          text: "Este pedido no tiene productos para devolver.",

          background: "#1e293b",

        `,
        showCancelButton: true,
        confirmButtonText: "Guardar devolución",
        cancelButtonText: "Cancelar",
        confirmButtonColor: "#f97316",
        cancelButtonColor: "#64748b",
        didOpen: () => {
          document.getElementById("btnToggleTodosDevolucion")?.addEventListener("click", () => {
            const checks = [...document.querySelectorAll(".chk-producto-devolucion, .chk-codigo-devolucion")];
            const hayDesmarcado = checks.some(chk => !chk.checked);
            checks.forEach(chk => chk.checked = hayDesmarcado);
          });

          document.querySelectorAll(".chk-producto-devolucion").forEach(chkProducto => {
            chkProducto.addEventListener("change", () => {
              const detalleId = chkProducto.dataset.detalleId;
              document.querySelectorAll(`.chk-codigo-devolucion[data-detalle-id="${detalleId}"]`).forEach(chk => {
                chk.checked = chkProducto.checked;
              });
            });
          });
        },
        preConfirm: () => {
          const motivo = document.getElementById("motivoDevolucionModal")?.value.trim() || "";
          const observaciones = document.getElementById("observacionesDevolucionModal")?.value.trim() || "";

          if (!motivo) {
            Swal.showValidationMessage("Escribe el motivo de la devolución");
            return false;
          }

          const seleccion = new Map();

          document.querySelectorAll(".chk-codigo-devolucion:checked").forEach(chk => {
            const detalleId = chk.dataset.detalleId;
            if (!seleccion.has(detalleId)) {
              seleccion.set(detalleId, {
                pedido_detalle_id: Number(detalleId),
                producto_id: Number(chk.dataset.productoId || 0),
                codigos_producto: []

            seleccion.get(detalleId).codigos_producto.push(chk.dataset.codigo);

            const detalleId = chk.dataset.detalleId;

                pedido_detalle_id: Number(detalleId),
                producto_id: Number(chk.dataset.productoId || 0),
                codigos_producto: []

          const productos_devueltos = [...seleccion.values()];

          if (productos_devueltos.length === 0) {

            return false;

          return { motivo_devolucion: motivo, observaciones, productos_devueltos };

  function obtenerNombreTiendaDetalle(detalle = {}) {
    return (
      detalle.tienda ||
      detalle.nombre_tienda ||
      detalle.vendedor ||
      detalle.nombre_vendedor ||
      detalle.propietario ||
      detalle.nombre_propietario ||
      detalle.nombre_emprendimiento ||
      "Mi tienda"
    );
  }

  function agruparDetallesPorTienda(detalles = []) {
    const grupos = new Map();

    (Array.isArray(detalles) ? detalles : []).forEach((detalle) => {
      const tienda = obtenerNombreTiendaDetalle(detalle);
      const clave = normalizarTexto(tienda) || "mi-tienda";

      if (!grupos.has(clave)) {
        grupos.set(clave, {
          tienda,
          productos: [],
          total: 0,
          cantidad: 0
        });
      }

      const grupo = grupos.get(clave);
      grupo.productos.push(detalle);
      grupo.total += Number(detalle.subtotal || 0);
      grupo.cantidad += Number(detalle.cantidad || 0);
    });

    return [...grupos.values()];
  }

  function extraerCampoResumenPedido(resumen, etiqueta) {
    const lineas = String(resumen || "").split(/\r?\n/);
    const etiquetaNormalizada = normalizarTexto(etiqueta).replace(/:$/, "");
    const linea = lineas.find(item => normalizarTexto(item).startsWith(etiquetaNormalizada + ":"));
    if (!linea) return "";
    return linea.slice(linea.indexOf(":") + 1).trim();
  }

  window.generarPdfPedidoDetalle = async function(id) {
    const cache = window.pedidosDetallePdfCache?.get(Number(id));

    if (!cache || !cache.pedido) {
      Swal.fire({
        title: "Abre el pedido otra vez",
        text: "No se encontraron los datos del pedido para generar el PDF.",
        icon: "warning",
        background: "#1e293b",
        color: "white"
      });
      return;
    }

    const { pedido, detalles } = cache;
    const jsPDF = window.jspdf?.jsPDF;

    if (!jsPDF) {
      Swal.fire({
        title: "No se pudo cargar PDF",
        text: "La librería jsPDF no está disponible. Revisa tu conexión o el CDN.",
        icon: "error",
        background: "#1e293b",
        color: "white"
      });
      return;
    }

    const doc = new jsPDF({ unit: "pt", format: "letter" });
    const pageW = doc.internal.pageSize.getWidth();
    const pageH = doc.internal.pageSize.getHeight();
    const margin = 30;
    const rightX = pageW - margin;
    const contentW = pageW - margin * 2;

    const safePdf = (valor) => String(valor ?? "").replace(/[\r\n\t]+/g, " ").replace(/\s+/g, " ").trim() || "—";
    const moneyPdf = (valor) => `$${Number(valor || 0).toFixed(2)}`;
    const productosPdf = Array.isArray(detalles) ? detalles : [];
    const subtotalPdf = productosPdf.reduce((acc, item) => acc + Number(item.subtotal || 0), 0);
    const envioPdf = Math.max(Number(pedido.total || 0) - subtotalPdf, 0);
    const impuestoPdf = 0;
    const correoPdf = extraerCampoResumenPedido(pedido.resumen_pedido, "Correo") || "Sin correo";
    const notaClientePdf = pedido.nota_cliente || extraerCampoResumenPedido(pedido.resumen_pedido, "Nota cliente") || "Sin nota";
    const notaInternaPdf = document.getElementById("notaAdminModal")?.value || pedido.nota_admin || "Sin nota interna";

    const C = {
      navy: [9, 16, 32],
      navy2: [15, 23, 42],
      ink: [15, 23, 42],
      muted: [83, 99, 124],
      soft: [248, 250, 252],
      soft2: [241, 245, 249],
      line: [203, 213, 225],
      cyan: [14, 165, 233],
      green: [22, 163, 74],
      greenText: [21, 128, 61]
    };

    function fill(rgb) { doc.setFillColor(rgb[0], rgb[1], rgb[2]); }
    function draw(rgb) { doc.setDrawColor(rgb[0], rgb[1], rgb[2]); }
    function text(rgb) { doc.setTextColor(rgb[0], rgb[1], rgb[2]); }

    function labelValue(label, value, x, y, w) {
      doc.setFont("helvetica", "bold");
      doc.setFontSize(7);
      text(C.muted);
      doc.text(label.toUpperCase(), x, y);
      doc.setFont("helvetica", "bold");
      doc.setFontSize(8.6);
      text(C.ink);
      const lines = doc.splitTextToSize(safePdf(value), w);
      doc.text(lines.slice(0, 2), x, y + 12);
    }

    function infoMini(label, value, x, y, w, h = 35) {
      fill(C.soft);
      draw(C.line);
      doc.roundedRect(x, y, w, h, 5, 5, "FD");
      labelValue(label, value, x + 8, y + 12, w - 16);
    }

    function section(title, y) {
      doc.setFont("helvetica", "bold");
      doc.setFontSize(10.5);
      text(C.ink);
      doc.text(title, margin, y);
      draw(C.cyan);
      doc.setLineWidth(0.8);
      doc.line(margin, y + 8, rightX, y + 8);
      return y + 18;
    }

    // Fondo
    fill([255, 255, 255]);
    doc.rect(0, 0, pageW, pageH, "F");
    draw([226, 232, 240]);
    doc.setLineWidth(0.7);
    doc.roundedRect(margin - 10, 22, contentW + 20, pageH - 44, 8, 8, "S");

    // Encabezado compacto
    let y = 38;
    fill(C.navy);
    doc.roundedRect(margin, y, contentW, 66, 8, 8, "F");
    fill(C.cyan);
    doc.roundedRect(margin, y, 5, 66, 3, 3, "F");

    doc.setFont("helvetica", "bold");
    doc.setFontSize(17);
    doc.setTextColor(255, 255, 255);
    doc.text("TiendaPro", margin + 18, y + 24);
    doc.setFontSize(10);
    doc.text("DETALLE DE PEDIDO", margin + 18, y + 41);
    doc.setFont("helvetica", "normal");
    doc.setFontSize(7.4);
    doc.setTextColor(203, 213, 225);
    doc.text(`${safePdf(pedido.codigo_pedido || "#" + pedido.id)} · ID interno #${safePdf(pedido.id)} · ${safePdf(formatearFecha(pedido.fecha_pedido))}`, margin + 18, y + 55);

    doc.setFont("helvetica", "bold");
    doc.setFontSize(9.5);
    doc.setTextColor(74, 222, 128);
    doc.text(safePdf(pedido.estado || "Pendiente"), rightX - 118, y + 25);
    doc.setFontSize(16);
    doc.text(moneyPdf(pedido.total), rightX - 118, y + 47);
    y += 86;

    // Información cliente en compacto
    y = section("Información del cliente y entrega", y);
    const colGap = 10;
    const colW = (contentW - colGap) / 2;
    infoMini("Cliente", pedido.cliente || "Cliente no registrado", margin, y, colW);
    infoMini("Dirección de envío", pedido.direccion_envio || "Sin dirección", margin + colW + colGap, y, colW);
    y += 42;
    infoMini("Teléfono", pedido.telefono || "Sin teléfono", margin, y, colW);
    infoMini("Correo", correoPdf, margin + colW + colGap, y, colW);
    y += 42;
    infoMini("Método de pago", pedido.metodo_pago || "No especificado", margin, y, colW);
    infoMini("Fechas", `Pedido: ${formatearFecha(pedido.fecha_pedido)} · Entrega: ${pedido.fecha_entregado ? formatearFecha(pedido.fecha_entregado) : "No entregado"}`, margin + colW + colGap, y, colW);
    y += 52;

    // Productos en tabla compacta, siempre en la misma hoja
    y = section("Productos del pedido", y);
    const tableX = margin;
    const tableW = contentW;
    const cProducto = tableX + 10;
    const cCant = tableX + 324;
    const cPrecio = tableX + 386;
    const cSubtotal = rightX - 10;

    fill(C.navy);
    doc.roundedRect(tableX, y, tableW, 24, 6, 6, "F");
    doc.setFont("helvetica", "bold");
    doc.setFontSize(7.7);
    doc.setTextColor(255, 255, 255);
    doc.text("PRODUCTO", cProducto, y + 16);
    doc.text("CANT.", cCant, y + 16, { align: "center" });
    doc.text("PRECIO", cPrecio + 45, y + 16, { align: "right" });
    doc.text("SUBTOTAL", cSubtotal, y + 16, { align: "right" });
    y += 29;

    const productosDisponiblesH = Math.max(130, pageH - y - 215);
    const rowH = productosPdf.length > 5 ? Math.max(26, Math.floor(productosDisponiblesH / Math.max(productosPdf.length, 1))) : 38;

    if (productosPdf.length === 0) {
      doc.setFont("helvetica", "normal");
      doc.setFontSize(8.5);
      text(C.muted);
      doc.text("No se encontraron productos detallados para este pedido.", margin, y + 10);
      y += 24;
    } else {
      productosPdf.forEach((detalle, index) => {
        const codigos = Array.isArray(detalle.codigos_producto) ? detalle.codigos_producto : [];
        const tipo = normalizarTexto(detalle.tipo_venta || "stock").includes("import") || normalizarTexto(detalle.tipo_venta || "").includes("bajo") ? "Importación" : "Stock";
        const codigoTexto = codigos.length ? codigos.join(", ") : "Sin código físico asignado";

        fill(index % 2 === 0 ? C.soft : C.soft2);
        draw([226, 232, 240]);
        doc.roundedRect(tableX, y, tableW, rowH, 5, 5, "FD");

        doc.setFont("helvetica", "bold");
        doc.setFontSize(rowH < 32 ? 7.6 : 8.4);
        text(C.ink);
        const nombre = doc.splitTextToSize(safePdf(detalle.nombre_producto || "Producto"), 245)[0];
        doc.text(nombre, cProducto, y + 13);

        doc.setFont("helvetica", "normal");
        doc.setFontSize(rowH < 32 ? 6.4 : 7.1);
        text(C.muted);
        const meta = `${tipo}${detalle.tiempo_entrega ? " · " + safePdf(detalle.tiempo_entrega) : ""} · Código: ${codigoTexto}`;
        const metaLine = doc.splitTextToSize(meta, 300)[0];
        doc.text(metaLine, cProducto, y + (rowH < 32 ? 23 : 27));

        doc.setFont("helvetica", "bold");
        doc.setFontSize(8.2);
        text(C.ink);
        doc.text(String(Number(detalle.cantidad || 0)), cCant, y + 15, { align: "center" });
        doc.text(moneyPdf(detalle.precio_unitario), cPrecio + 45, y + 15, { align: "right" });
        text(C.greenText);
        doc.text(moneyPdf(detalle.subtotal), cSubtotal, y + 15, { align: "right" });
        y += rowH + 5;
      });
    }

    // Área inferior: notas a la izquierda y totales a la derecha
    const bottomTop = Math.min(y + 8, pageH - 178);
    const notesW = contentW - 230;
    const totalsW = 210;
    const totalsX = rightX - totalsW;

    doc.setFont("helvetica", "bold");
    doc.setFontSize(10);
    text(C.ink);
    doc.text("Notas", margin, bottomTop);
    draw(C.cyan);
    doc.line(margin, bottomTop + 8, margin + notesW, bottomTop + 8);

    function noteLine(label, value, yy) {
      fill(C.soft);
      draw(C.line);
      doc.roundedRect(margin, yy, notesW, 31, 5, 5, "FD");
      doc.setFont("helvetica", "bold");
      doc.setFontSize(7);
      text(C.muted);
      doc.text(label.toUpperCase(), margin + 8, yy + 11);
      doc.setFont("helvetica", "normal");
      doc.setFontSize(8.2);
      text(C.ink);
      const line = doc.splitTextToSize(safePdf(value), notesW - 16)[0];
      doc.text(line, margin + 8, yy + 23);
    }

    noteLine("Nota cliente", notaClientePdf, bottomTop + 18);
    noteLine("Motivo devolución", pedido.motivo_devolucion || "Sin devolución registrada", bottomTop + 54);
    noteLine("Nota interna", notaInternaPdf, bottomTop + 90);

    fill(C.soft);
    draw(C.line);
    doc.roundedRect(totalsX, bottomTop + 18, totalsW, 116, 7, 7, "FD");
    doc.setFont("helvetica", "bold");
    doc.setFontSize(9);
    text(C.ink);
    doc.text("Resumen de pago", totalsX + 12, bottomTop + 36);

    function totalRow(label, value, yy, strong = false) {
      doc.setFont("helvetica", strong ? "bold" : "normal");
      doc.setFontSize(strong ? 10 : 8.5);
      text(strong ? C.ink : C.muted);
      doc.text(label, totalsX + 12, yy);
      doc.setFont("helvetica", "bold");
      doc.setFontSize(strong ? 12 : 8.8);
      text(strong ? C.greenText : C.ink);
      doc.text(moneyPdf(value), totalsX + totalsW - 12, yy, { align: "right" });
    }

    totalRow("Subtotal", subtotalPdf, bottomTop + 56);
    totalRow("Envío", envioPdf, bottomTop + 73);
    totalRow("Impuesto", impuestoPdf, bottomTop + 90);
    draw(C.line);
    doc.line(totalsX + 12, bottomTop + 99, totalsX + totalsW - 12, bottomTop + 99);
    totalRow("TOTAL", pedido.total, bottomTop + 117, true);

    // Pie fijo en la misma página
    draw(C.line);
    doc.setLineWidth(0.5);
    doc.line(margin, pageH - 32, rightX, pageH - 32);
    doc.setFont("helvetica", "normal");
    doc.setFontSize(7);
    text(C.muted);
    doc.text("Documento generado automáticamente desde TiendaPro · Módulo de Pedidos", margin, pageH - 18);
    doc.text("Página 1 de 1", rightX, pageH - 18, { align: "right" });

    const blob = doc.output("blob");
    const url = URL.createObjectURL(blob);

    await Swal.fire({
      title: "Vista previa PDF del pedido",
      width: "95%",
      background: "#1e293b",
      color: "white",
      html: `<iframe class="pdf-preview-frame" src="${url}" style="width:100%;height:72vh;border:1px solid #334155;border-radius:14px;background:white;"></iframe>`,
      confirmButtonText: "Cerrar",
      confirmButtonColor: "#3b82f6",
      willClose: () => URL.revokeObjectURL(url)
    });
  };

      </div>
    `).join("");
  }

  window.verDetallePedido = async function(id) {

        icon: "warning",
        background: "#1e293b",
        color: "white"
      });
      return;
    }

    let detallesPedido = [];

    try {
      const detalleRes = await axios.get(`${API}/pedidos/${id}/detalles`, authHeaders);
      detallesPedido = Array.isArray(detalleRes.data?.detalles) ? detalleRes.data.detalles : [];
    } catch (error) {
      console.log("No se pudieron cargar los productos del pedido:", error);
    }

    const esImportacion = pedidoTieneImportacion(pedido);

      <button
        type="button"
        class="btn-seguimiento ${normalizarTexto(pedido.estado) === normalizarTexto(estado) ? "activo" : ""}"
        onclick="actualizarEstadoDesdeDetalle(${pedido.id}, '${estado}')"
      >
        ${iconoEstado(estado)} ${estado}

        🛒 Pedido al proveedor
      </button>
    ` : "";

    window.pedidosDetallePdfCache.set(Number(pedido.id), {
      pedido: { ...pedido },
      detalles: Array.isArray(detallesPedido) ? detallesPedido.map(item => ({ ...item })) : []
    });

    Swal.fire({
      title: "",
      width: "1100px",
      background: "#0f172a",
      color: "white",
      customClass: {
        popup: "pedido-detalle-modal"
      },
      html: `
        <div class="pedido-modal-v2">
          <div class="pedido-modal-header-v2">
            <div class="pedido-modal-title-v2">
              <h2>🧾 Pedido ${escaparHtml(pedido.codigo_pedido || "#" + pedido.id)}</h2>
              <p>ID interno #${escaparHtml(pedido.id)} · ${escaparHtml(formatearFecha(pedido.fecha_pedido))}</p>
            </div>

            <div class="pedido-modal-summary-v2">
              <span class="estado-badge ${claseEstado(pedido.estado)}">
                ${iconoEstado(pedido.estado)} ${escaparHtml(pedido.estado || "Pendiente")}
              </span>
              <span class="pedido-total-pill-v2">Total $${Number(pedido.total || 0).toFixed(2)}</span>
            </div>
          </div>

          <div class="pedido-content-v2">
            <div class="pedido-section-title-v2">
              <h3>Información principal</h3>
            </div>

            <div class="pedido-info-grid-v2">
              <div class="pedido-card-v2"><small>👤 Cliente</small><strong>${escaparHtml(pedido.cliente || "Cliente no registrado")}</strong></div>
              <div class="pedido-card-v2"><small>📞 Teléfono</small><strong>${escaparHtml(pedido.telefono || "Sin teléfono")}</strong></div>
              <div class="pedido-card-v2"><small>💳 Método de pago</small><strong>${escaparHtml(pedido.metodo_pago || "No especificado")}</strong></div>
              <div class="pedido-card-v2"><small>🚚 Tipo de flujo</small><strong>${esImportacion ? "Bajo pedido / importación" : "Producto en stock"}</strong></div>
              <div class="pedido-card-v2"><small>📤 Fecha envío</small><strong>${pedido.fecha_envio ? escaparHtml(formatearFecha(pedido.fecha_envio)) : "No enviado"}</strong></div>
              <div class="pedido-card-v2"><small>✅ Fecha entregado</small><strong>${pedido.fecha_entregado ? escaparHtml(formatearFecha(pedido.fecha_entregado)) : "No entregado"}</strong></div>
              <div class="pedido-card-v2" style="grid-column:1/-1;"><small>📍 Dirección envío</small><strong>${escaparHtml(pedido.direccion_envio || "Sin dirección")}</strong></div>
            </div>

            <div class="pedido-section-title-v2">
              <h3>Seguimiento y acciones</h3>
            </div>

            <div class="pedido-actions-v2">
              <div class="pedido-action-buttons-v2">
                ${botonPedidoProveedor}
                <button type="button" class="btn-devolucion" onclick="solicitarDevolucionPedido(${pedido.id})">↩️ Crear devolución</button>
                <button type="button" class="btn-cancelar-pedido" onclick="actualizarEstadoDesdeDetalle(${pedido.id}, 'Cancelado')">🔴 Cancelar pedido</button>
              </div>

              <div>
                <div class="pedido-progress-v2">
                  ${renderPasosProgresoPedido(pedido, esImportacion)}
                </div>

                <div class="estado-dropdown">
                  <button type="button" class="btn-estado-principal" onclick="toggleMenuEstadosPedido(${pedido.id})">
                    ${iconoEstado(pedido.estado)} Cambiar estado: ${escaparHtml(pedido.estado || "Pendiente")} ▼
                  </button>

                  <div id="menuEstadosPedido-${pedido.id}" class="menu-estados-pedido">
                    <div class="seguimiento-linea">${opcionesSeguimiento}</div>
                  </div>
                </div>
              </div>
            </div>

            <div class="pedido-section-title-v2">
              <h3>Productos del pedido agrupados por tienda</h3>
            </div>

            <div class="pedido-products-list-v2">
              ${renderDetalleProductosPedido(detallesPedido)}
            </div>

            <div class="pedido-section-title-v2">
              <h3>Notas y respaldo</h3>
            </div>

            <div class="pedido-notes-grid-v2">
              <div class="pedido-note-wrap-v2">
                <strong>Nota cliente</strong>
                <div class="pedido-note-v2">${escaparHtml(pedido.nota_cliente || "Sin nota")}</div>
              </div>

              <div class="pedido-note-wrap-v2">
                <strong>Motivo devolución</strong>
                <div class="pedido-note-v2">${escaparHtml(pedido.motivo_devolucion || "Sin devolución registrada")}</div>
              </div>
            </div>

            <div class="pedido-section-title-v2">
              <h3>Nota interna</h3>
            </div>

            <textarea id="notaAdminModal" class="nota-admin-area" placeholder="Escribe aquí una nota interna para el empleado o administrador...">${escaparHtml(pedido.nota_admin || "")}</textarea>
            <button type="button" class="btn-guardar-nota" onclick="guardarNotaAdminPedido(${pedido.id})">Guardar nota interna</button>

            <div class="pedido-section-title-v2">
              <h3>Historial / bitácora del pedido</h3>
            </div>

            ${renderBitacoraPedidoPreview(pedido)}

            <div class="resumen-header-actions-v2">
              <h3>Documento del pedido</h3>
              <button type="button" class="btn-detalles-pedido" onclick="abrirDetallesPedidoDocumento(${pedido.id})">📋 Detalles</button>
            </div>
          </div>

        </div>
      `,
      confirmButtonText: "Cerrar",
      confirmButtonColor: "#3b82f6"
    });
  };

  /* =====================================================
     JAVASCRIPT / CARGA INICIAL
     ===================================================== */

  cargarPedidos();
</script>
