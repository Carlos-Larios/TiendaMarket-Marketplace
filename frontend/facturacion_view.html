<script type="module">
import axios from "https://cdn.jsdelivr.net/npm/axios@1.7.7/+esm";

const API = "http://localhost:3000/api";
const authHeaders = { headers: { Authorization: `Bearer ${facturasToken}` } };

let paginaActual = 1;
const limiteFacturas = 20;
let totalFacturasActual = 0;
let totalPaginasActual = 1;
let busquedaActual = "";
let estadoActual = "";
let fechaActual = "";
let facturasGlobales = [];
let ordenCampoFacturas = "";
let ordenDireccionFacturas = "asc";
let destinoPendienteFacturasProcesado = false;

const buscarFactura = document.getElementById("buscarFactura");
const filtroEstadoFactura = document.getElementById("filtroEstadoFactura");
const filtroFechaFactura = document.getElementById("filtroFechaFactura");
const limpiarFiltrosFacturas = document.getElementById("limpiarFiltrosFacturas");
const contadorFacturas = document.getElementById("contadorFacturas");


function obtenerDestinoPendienteVista(vista, acciones = []) {
  let destino = window.TIENDAPRO_DESTINO_PENDIENTE || null;
  if (!destino) {
    try { destino = JSON.parse(localStorage.getItem('tiendapro_destino_pendiente') || 'null'); } catch { destino = null; }
  }
  if (!destino) return null;
  if (vista && destino.vista && destino.vista !== vista) return null;
  if (acciones.length && !acciones.includes(destino.accion)) return null;
  return destino;
}
function limpiarDestinoPendienteVista() {
  window.TIENDAPRO_DESTINO_PENDIENTE = null;
  try { localStorage.removeItem('tiendapro_destino_pendiente'); } catch {}
}
function resaltarRegistroPendiente(selector) {
  const el = document.querySelector(selector);
  if (!el) return;
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  el.style.outline = '2px solid #38bdf8';
  el.style.boxShadow = '0 0 0 6px rgba(56,189,248,.16)';
  setTimeout(() => { el.style.outline = ''; el.style.boxShadow = ''; }, 2400);
}

async function procesarDestinoPendienteFacturas() {
  if (destinoPendienteFacturasProcesado) return;
  const destino = obtenerDestinoPendienteVista('facturacion_view.html');
  if (!destino) return;
  destinoPendienteFacturasProcesado = true;
  const registro = String(destino.registro || destino.idVisible || '').trim();
    const soloFiltrarDestino = destino.soloFiltrar === true || destino.abrirDetalle === false || destino.accion === 'filtrarRegistro';
  if (!registro) return limpiarDestinoPendienteVista();
  let factura = facturasGlobales.find(f => String(f.id) === registro || normalizarTextoOrden(f.numero_factura || '') === normalizarTextoOrden(registro));
  if (!factura) {
    try {
      busquedaActual = registro;
      if (buscarFactura) buscarFactura.value = registro;
      paginaActual = 1;
      const params = new URLSearchParams({ page: 1, limit: limiteFacturas, search: registro, estado: estadoActual, fecha: fechaActual });
      const res = await axios.get(`${API}/facturas?${params.toString()}`, authHeaders);
      facturasGlobales = Array.isArray(res.data.facturas) ? res.data.facturas : [];
      totalFacturasActual = Number(res.data.total || facturasGlobales.length);
      totalPaginasActual = Number(res.data.totalPaginas || 1);
      mostrarFacturas(facturasGlobales);
      renderizarPaginacionFacturas();
      factura = facturasGlobales.find(f => String(f.id) === registro || normalizarTextoOrden(f.numero_factura || '') === normalizarTextoOrden(registro)) || facturasGlobales[0];
    } catch (error) { console.error('No se pudo preparar la factura buscada:', error); }
  }
  if (factura) {
    limpiarDestinoPendienteVista();
    setTimeout(() => {
      resaltarRegistroPendiente(`[data-factura-id="${factura.id}"]`);
      if (!soloFiltrarDestino) window.verDetalleFactura(Number(factura.id));
    }, 260);
  } else limpiarDestinoPendienteVista();
}

function formatearFecha(fecha){ if(!fecha) return "Sin fecha"; return fecha.toString().replace("T"," ").slice(0,19); }
function estadoClase(estado){ return `estado-${(estado || "pendiente").toLowerCase()}`; }

function escaparHtml(valor){
  return String(valor ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function mostrarToastCodigoCopiado(codigo) {
  let toast = document.getElementById("toastCodigoCopiado");

  if (!toast) {
    toast = document.createElement("div");
    toast.id = "toastCodigoCopiado";
    toast.className = "toast-codigo-copiado";
    document.body.appendChild(toast);
  }

  toast.innerHTML = `
    <strong>✓ Número de factura copiado</strong>
    <span>${escaparHtml(codigo)}</span>
  `;

  toast.classList.add("visible");
  clearTimeout(window.toastCodigoCopiadoTimer);
  window.toastCodigoCopiadoTimer = setTimeout(() => {
    toast.classList.remove("visible");
    setTimeout(() => {
      if (toast && !toast.classList.contains("visible")) toast.remove();
    }, 220);
  }, 2000);
}

window.copiarNumeroFacturaFacturacion = async function(event, numeroFactura) {
  if (event) {
    event.preventDefault();
    event.stopPropagation();
  }

  const texto = String(numeroFactura || "").trim();
  if (!texto || texto === "Sin número") return;

  const boton = event?.currentTarget || null;
  const icono = boton?.querySelector(".copy-icon");
  const iconoOriginal = icono ? icono.textContent : "⧉";

  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(texto);
    } else {
      const inputTemporal = document.createElement("textarea");
      inputTemporal.value = texto;
      inputTemporal.setAttribute("readonly", "");
      inputTemporal.style.position = "fixed";
      inputTemporal.style.left = "-9999px";
      document.body.appendChild(inputTemporal);
      inputTemporal.select();
      document.execCommand("copy");
      document.body.removeChild(inputTemporal);
    }

    if (boton) boton.classList.add("copiado");
    if (icono) icono.textContent = "✓";
    mostrarToastCodigoCopiado(texto);

    setTimeout(() => {
      if (boton) boton.classList.remove("copiado");
      if (icono) icono.textContent = iconoOriginal;
    }, 1000);
  } catch (error) {
    console.log("No se pudo copiar la factura:", error);
    Swal.fire({
      title: "No se pudo copiar",
      text: "Copia el número manualmente: " + texto,
      icon: "warning",
      background: "#1e293b",
      color: "white"
    });
  }
};

function normalizarTextoOrden(texto) {
  return (texto || "").toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
}

function valorOrdenFactura(factura, campo) {
  if (["id", "pedido_id", "subtotal", "envio", "impuesto", "total"].includes(campo)) return Number(factura[campo] || 0);
  if (campo === "fecha_factura") return new Date(factura.fecha_factura || 0).getTime();
  return normalizarTextoOrden(factura[campo] || "");
}

function ordenarFacturasLista(facturas) {
  if (!ordenCampoFacturas) return [...facturas];

  return [...facturas].sort((a, b) => {
    const va = valorOrdenFactura(a, ordenCampoFacturas);
    const vb = valorOrdenFactura(b, ordenCampoFacturas);

    if (typeof va === "number" && typeof vb === "number") {
      return ordenDireccionFacturas === "asc" ? va - vb : vb - va;
    }

    return ordenDireccionFacturas === "asc"
      ? String(va).localeCompare(String(vb), "es")
      : String(vb).localeCompare(String(va), "es");
  });
}

function actualizarIconosOrdenFacturas() {
  document.querySelectorAll(".tabla-facturas .sortable-th").forEach(th => {
    const icon = th.querySelector(".sort-icon");
    const activo = th.dataset.sort === ordenCampoFacturas;
    th.classList.toggle("activo", activo);
    if (icon) icon.textContent = activo ? (ordenDireccionFacturas === "asc" ? "▲" : "▼") : "↕";
  });
}

document.querySelectorAll(".tabla-facturas .sortable-th").forEach(th => {
  th.addEventListener("click", () => {
    const campo = th.dataset.sort;
    if (ordenCampoFacturas === campo) {
      ordenDireccionFacturas = ordenDireccionFacturas === "asc" ? "desc" : "asc";
    } else {
      ordenCampoFacturas = campo;
      ordenDireccionFacturas = ["id", "fecha_factura", "total", "subtotal"].includes(campo) ? "desc" : "asc";
    }
    mostrarFacturas(facturasGlobales);
  });
});

async function cargarFacturas(){
  try{
    const params = new URLSearchParams({page:paginaActual,limit:limiteFacturas,search:busquedaActual,estado:estadoActual,fecha:fechaActual});
    const res = await axios.get(`${API}/facturas?${params.toString()}`, authHeaders);
    facturasGlobales = Array.isArray(res.data.facturas) ? res.data.facturas : [];
    totalFacturasActual = Number(res.data.total || facturasGlobales.length);
    totalPaginasActual = Number(res.data.totalPaginas || 1);
    mostrarFacturas(facturasGlobales);
    renderizarPaginacionFacturas();
    setTimeout(procesarDestinoPendienteFacturas, 120);
  }catch(error){
    console.log(error);
    Swal.fire({title:"Error",text:"No se pudieron cargar las facturas. Revisa el servidor y la conexión con la base de datos.",icon:"error",background:"#1e293b",color:"white"});
  }
}

function mostrarFacturas(facturas){
  const tabla = document.getElementById("tablaFacturas");
  contadorFacturas.innerText = totalFacturasActual;
  tabla.innerHTML = "";
  if(facturas.length === 0){
    tabla.innerHTML = `<tr><td colspan="10" class="sin-resultados">No hay facturas registradas</td></tr>`;
    return;
  }
  const facturasOrdenadas = ordenarFacturasLista(facturas);
  actualizarIconosOrdenFacturas();

  facturasOrdenadas.forEach(factura => {
    tabla.innerHTML += `
      <tr class="fila-factura" data-factura-id="${factura.id}" title="Clic para ver detalles" onclick="verDetalleFactura(${factura.id})">
        <td>#${factura.id}</td>
        <td class="numero-factura">
          <span class="codigo-copy-wrap">
            <span class="codigo-texto">${escaparHtml(factura.numero_factura || "Sin número")}</span>
            ${factura.numero_factura ? `
              <button
                type="button"
                class="btn-copiar-codigo"
                title="Copiar número de factura"
                aria-label="Copiar número de factura ${escaparHtml(factura.numero_factura)}"
                onclick="copiarNumeroFacturaFacturacion(event, '${escaparHtml(factura.numero_factura)}')"
              >
                <span class="copy-icon">⧉</span>
              </button>
            ` : ""}
          </span>
        </td>
        <td>${factura.codigo_pedido || "Pedido #" + factura.pedido_id}</td>
        <td>${factura.cliente || "Cliente no registrado"}</td>
        <td>$${Number(factura.subtotal || 0).toFixed(2)}</td>
        <td>$${Number(factura.envio || 0).toFixed(2)}</td>
        <td>$${Number(factura.impuesto || 0).toFixed(2)}</td>
        <td class="total-factura">$${Number(factura.total || 0).toFixed(2)}</td>
        <td><span class="estado-factura ${estadoClase(factura.estado)}">${factura.estado || "pendiente"}</span></td>
        <td>${formatearFecha(factura.fecha_factura)}</td>
      </tr>`;
  });
}

function renderizarPaginacionFacturas(){
  const paginacion = document.getElementById("paginacionFacturas");
  const info = document.getElementById("infoFacturas");
  const inicio = totalFacturasActual === 0 ? 0 : ((paginaActual - 1) * limiteFacturas) + 1;
  const fin = Math.min(paginaActual * limiteFacturas, totalFacturasActual);
  info.innerText = `Mostrando ${inicio}-${fin} de ${totalFacturasActual} facturas`;
  if(totalPaginasActual <= 1){ paginacion.innerHTML = ""; return; }
  paginacion.innerHTML = `
    <button ${paginaActual <= 1 ? "disabled" : ""} onclick="cambiarPaginaFacturas(${paginaActual - 1})">← Anterior</button>
    <span>Página ${paginaActual} de ${totalPaginasActual}</span>
    <button ${paginaActual >= totalPaginasActual ? "disabled" : ""} onclick="cambiarPaginaFacturas(${paginaActual + 1})">Siguiente →</button>`;
}

window.cambiarPaginaFacturas = function(nuevaPagina){
  if(nuevaPagina < 1 || nuevaPagina > totalPaginasActual) return;
  paginaActual = nuevaPagina;
  cargarFacturas();
};

function actualizarFiltros(){
  busquedaActual = buscarFactura.value.trim();
  estadoActual = filtroEstadoFactura.value.trim();
  fechaActual = filtroFechaFactura.value.trim();
  paginaActual = 1;
  cargarFacturas();
}

let temporizador = null;
buscarFactura.addEventListener("input", () => { clearTimeout(temporizador); temporizador = setTimeout(actualizarFiltros, 350); });
filtroEstadoFactura.addEventListener("change", actualizarFiltros);
filtroFechaFactura.addEventListener("change", actualizarFiltros);
limpiarFiltrosFacturas.addEventListener("click", () => { buscarFactura.value=""; filtroEstadoFactura.value=""; filtroFechaFactura.value=""; cerrarFiltrosFacturas(); actualizarFiltros(); });

function abrirFiltrosFacturas(){
  filtrosFacturasOverlay.classList.add("activo");
  filtrosFacturasPanel.classList.add("abierto");
}

function cerrarFiltrosFacturas(){
  filtrosFacturasOverlay.classList.remove("activo");
  filtrosFacturasPanel.classList.remove("abierto");
}

btnAbrirFiltrosFacturas.addEventListener("click", abrirFiltrosFacturas);
btnCerrarFiltrosFacturas.addEventListener("click", cerrarFiltrosFacturas);
filtrosFacturasOverlay.addEventListener("click", cerrarFiltrosFacturas);
btnAplicarFiltrosFacturas.addEventListener("click", () => { cerrarFiltrosFacturas(); actualizarFiltros(); });

window.cambiarEstadoFactura = async function(id, estado){
  try{
    const res = await axios.put(`${API}/facturas/${id}/estado`, { estado }, authHeaders);
    await cargarFacturas();
    Swal.fire({title:"Factura actualizada",text:res.data?.mensaje || "Cambio aplicado",icon:"success",background:"#1e293b",color:"white",timer:1500,showConfirmButton:false});
  }catch(error){
    console.log(error);
    const mensaje = error.response?.data?.mensaje || "No se pudo actualizar la factura";
    Swal.fire({title:"Acción bloqueada",text:mensaje,icon:"warning",background:"#1e293b",color:"white"});
  }
};

window.solicitarDevolucionFactura = async function(id){
  const resultado = await Swal.fire({
    title:"Solicitar devolución",
    input:"textarea",
    inputLabel:"Motivo de devolución",
    inputPlaceholder:"Escribe el motivo...",
    inputValidator:(value)=> !value ? "Debes escribir el motivo de la devolución" : undefined,
    showCancelButton:true,
    confirmButtonText:"Solicitar",
    cancelButtonText:"Cancelar",
    background:"#1e293b",
    color:"white",
    confirmButtonColor:"#7c3aed"
  });

  if(!resultado.isConfirmed) return;

  try{
    const res = await axios.put(`${API}/facturas/${id}/estado`, {
      estado:"devolucion_solicitada",
      motivo_devolucion: resultado.value
    }, authHeaders);
    await cargarFacturas();
    Swal.fire({title:"Devolución solicitada",text:res.data?.mensaje || "Solicitud registrada",icon:"success",background:"#1e293b",color:"white"});
  }catch(error){
    console.log(error);
    const mensaje = error.response?.data?.mensaje || "No se pudo solicitar la devolución";
    Swal.fire({title:"Acción bloqueada",text:mensaje,icon:"warning",background:"#1e293b",color:"white"});
  }
};


window.verFacturaPDF = async function(id){
  let url = null;
  try{
    const res = await axios.get(`${API}/facturas/${id}/pdf`, {
      headers: { Authorization: `Bearer ${facturasToken}` },
      responseType: "blob"
    });

    url = window.URL.createObjectURL(new Blob([res.data], { type: "application/pdf" }));

    await Swal.fire({
      title: "Vista previa de factura",
      width: "95%",
      background: "#1e293b",
      color: "white",
      html: `
        <iframe class="pdf-preview-frame" src="${url}"></iframe>
      `,
      confirmButtonText: "Cerrar",
      confirmButtonColor: "#3b82f6",
      willClose: () => {
        if (url) window.URL.revokeObjectURL(url);
      }
    });
  }catch(error){
    console.log(error);
    if (url) window.URL.revokeObjectURL(url);
    Swal.fire({title:"Error",text:"No se pudo abrir la vista previa del PDF",icon:"error",background:"#1e293b",color:"white"});
  }
};

window.editarFactura = async function(id){
  try{
    const res = await axios.get(`${API}/facturas/${id}`, authHeaders);
    const factura = res.data.factura;
    // El estado actual de la factura (pendiente, pagada, reembolsada, etc.)
    // pertenece al flujo de pago/pedido y no determina si el DTE ya fue emitido.
    // Mientras no exista una emisión DTE registrada, la factura puede corregirse.

    const resultado = await Swal.fire({
      title:`Editar ${factura.numero_factura}`,
      width:"620px",
      background:"#1e293b",
      color:"white",
      html:`
        <div style="text-align:left;display:grid;gap:12px;">
          <div style="padding:12px;border-radius:12px;background:#0f172a;color:#94a3b8;font-size:13px;">
            Los productos, cantidades, subtotal y envío provienen del pedido y no se pueden modificar desde Facturación.
          </div>
          <div style="padding:12px;border:1px solid #f59e0b;border-radius:12px;background:rgba(245,158,11,.08);color:#fbbf24;font-size:13px;line-height:1.45;">
            <strong>Automatización DTE pendiente.</strong><br>
            Falta integrar la API de Facturación Electrónica del Ministerio de Hacienda. Por ahora, los cambios se guardan únicamente en TiendaPro y no se transmiten como DTE.
          </div>
          <label>Método de pago
            <input id="editarFacturaMetodo" class="swal2-input" style="width:100%;margin:6px 0 0;box-sizing:border-box;" value="${String(factura.metodo_pago || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;')}">
          </label>
          <label>Descuento ($)
            <input id="editarFacturaDescuento" type="number" min="0" step="0.01" class="swal2-input" style="width:100%;margin:6px 0 0;box-sizing:border-box;" value="${Number(factura.descuento || 0).toFixed(2)}">
          </label>
          <label>Impuesto ($)
            <input id="editarFacturaImpuesto" type="number" min="0" step="0.01" class="swal2-input" style="width:100%;margin:6px 0 0;box-sizing:border-box;" value="${Number(factura.impuesto || 0).toFixed(2)}">
          </label>
        </div>`,
      showCancelButton:true,
      confirmButtonText:"Guardar cambios",
      cancelButtonText:"Cancelar",
      confirmButtonColor:"#f59e0b",
      preConfirm:()=>{
        const metodo_pago=document.getElementById('editarFacturaMetodo').value.trim();
        const descuento=Number(document.getElementById('editarFacturaDescuento').value || 0);
        const impuesto=Number(document.getElementById('editarFacturaImpuesto').value || 0);
        if (descuento < 0 || impuesto < 0) return Swal.showValidationMessage('Los valores no pueden ser negativos');
        return { metodo_pago, descuento, impuesto };
      }
    });

    if (!resultado.isConfirmed) return;
    await axios.put(`${API}/facturas/${id}/editar`, resultado.value, authHeaders);
    await cargarFacturas();
    Swal.fire({title:"Factura actualizada",text:"Los cambios se guardaron correctamente.",icon:"success",background:"#1e293b",color:"white",confirmButtonColor:"#3b82f6"});
  }catch(error){
    const mensaje=error.response?.data?.mensaje || "No se pudo editar la factura";
    Swal.fire({title:"Error",text:mensaje,icon:"error",background:"#1e293b",color:"white"});
  }
};

window.verDetalleFactura = async function(id){
  try{
    const res = await axios.get(`${API}/facturas/${id}`, authHeaders);
    const factura = res.data.factura;
    const detalles = Array.isArray(res.data.detalles) ? res.data.detalles : [];
    const filas = detalles.map(item => `
      <tr>
        <td>${item.nombre_producto || "Producto"}</td>
        <td>${Number(item.cantidad || 0)}</td>
        <td>$${Number(item.precio_unitario || 0).toFixed(2)}</td>
        <td>$${Number(item.subtotal || 0).toFixed(2)}</td>
      </tr>`).join("");

    const estadoFactura = (factura.estado || "pendiente").toLowerCase();
    const estadoPedido = factura.pedido_estado || "Sin estado";
    const pedidoLower = estadoPedido.toLowerCase();
    const diasEntrega = factura.dias_desde_entrega;
    const devolucionDisponible = factura.devolucion_disponible === true || factura.devolucion_disponible === 1;

    let botonesEstado = `
      <button class="btn-factura btn-editar" onclick="editarFactura(${factura.id})">Editar factura</button>
    `;

    if (estadoFactura === "pendiente") {
      botonesEstado += `
        <button class="btn-factura btn-pagada" onclick="cambiarEstadoFactura(${factura.id}, 'pagada')">Marcar pagada</button>
        <button class="btn-factura btn-anulada" onclick="cambiarEstadoFactura(${factura.id}, 'anulada')">Anular</button>
      `;
    } else if (estadoFactura === "pagada" && !["enviado", "entregado", "devolución solicitada", "devolucion solicitada", "devuelto", "cancelado"].includes(pedidoLower)) {
      botonesEstado += `
        <button class="btn-factura btn-anulada" onclick="cambiarEstadoFactura(${factura.id}, 'anulada')">Anular</button>
      `;
    } else if (estadoFactura === "pagada" && estadoPedido === "Entregado" && devolucionDisponible) {
      botonesEstado += `
        <button class="btn-factura btn-imprimir" onclick="solicitarDevolucionFactura(${factura.id})">Solicitar devolución</button>
      `;
    }

    const avisoReglas = estadoPedido === "Entregado"
      ? (devolucionDisponible
          ? `<div class="detalle-card" style="grid-column:1/-1;"><small>Devolución</small><strong>Disponible. Han pasado ${diasEntrega ?? 0} de 15 días desde la entrega.</strong></div>`
          : `<div class="detalle-card" style="grid-column:1/-1;"><small>Devolución</small><strong>Plazo vencido. Ya pasaron más de 15 días desde la entrega.</strong></div>`)
      : "";

    Swal.fire({
      title: factura.numero_factura,
      width:"900px",
      background:"#1e293b",
      color:"white",
      html:`
        <div class="detalle-factura-box" id="facturaParaImprimir">
          <div class="detalle-factura-grid">
            <div class="detalle-card"><small>Pedido</small><strong>${factura.codigo_pedido || "#" + factura.pedido_id}</strong></div>
            <div class="detalle-card"><small>Cliente</small><strong>${factura.cliente || "Cliente no registrado"}</strong></div>
            <div class="detalle-card"><small>Teléfono</small><strong>${factura.telefono || "Sin teléfono"}</strong></div>
            <div class="detalle-card"><small>Método de pago</small><strong>${factura.metodo_pago || "No especificado"}</strong></div>
            <div class="detalle-card"><small>Dirección</small><strong>${factura.direccion_envio || "Sin dirección"}</strong></div>
            <div class="detalle-card"><small>Estado factura</small><strong>${factura.estado || "pendiente"}</strong></div>
            <div class="detalle-card"><small>Estado pedido</small><strong>${estadoPedido}</strong></div>
            <div class="detalle-card" style="grid-column:1/-1;border-color:#f59e0b;background:rgba(245,158,11,.08);">
              <small style="color:#fbbf24;">DTE / Hacienda</small>
              <strong style="color:#fbbf24;">Automatización pendiente — falta integrar la API de Facturación Electrónica del Ministerio de Hacienda.</strong>
            </div>
            ${avisoReglas}
          </div>

          <table class="tabla-detalle-factura">
            <thead><tr><th>Producto</th><th>Cantidad</th><th>Precio</th><th>Subtotal</th></tr></thead>
            <tbody>${filas || `<tr><td colspan="4">Sin productos detallados</td></tr>`}</tbody>
          </table>

          <div class="detalle-factura-grid" style="margin-top:16px;">
            <div class="detalle-card"><small>Subtotal</small><strong>$${Number(factura.subtotal || 0).toFixed(2)}</strong></div>
            <div class="detalle-card"><small>Descuento</small><strong>$${Number(factura.descuento || 0).toFixed(2)}</strong></div>
            <div class="detalle-card"><small>Envío</small><strong>$${Number(factura.envio || 0).toFixed(2)}</strong></div>
            <div class="detalle-card"><small>Impuesto</small><strong>$${Number(factura.impuesto || 0).toFixed(2)}</strong></div>
            <div class="detalle-card"><small>Total</small><strong>$${Number(factura.total || 0).toFixed(2)}</strong></div>
            <div class="detalle-card"><small>Fecha</small><strong>${formatearFecha(factura.fecha_factura)}</strong></div>
          </div>

          <div class="acciones-factura">
            ${botonesEstado}
            <button class="btn-factura btn-ver-pdf" onclick="verFacturaPDF(${factura.id})">Ver PDF</button>
          </div>
        </div>`,
      confirmButtonText:"Cerrar",
      confirmButtonColor:"#3b82f6"
    });
  }catch(error){
    console.log(error);
    Swal.fire({title:"Error",text:"No se pudo abrir la factura",icon:"error",background:"#1e293b",color:"white"});
  }
};

cargarFacturas();
</script>
