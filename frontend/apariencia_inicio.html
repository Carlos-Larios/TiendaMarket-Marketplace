<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apariencia del inicio | TiendaPro</title><link rel="stylesheet" href="css/apariencia_inicio.css?v=142"></head>
<body>
  <header class="appearance-toolbar"><strong>Apariencia del inicio</strong><div><select id="preset" aria-label="Temática"><option value="custom">Personalizada</option><option value="christmas">Navidad</option><option value="sale">Temporada de ofertas</option><option value="default">Diseño original</option></select><button id="saveDraft" disabled>Guardar borrador</button><button id="publish" class="primary" disabled>Publicar en el inicio</button><a href="tienda_publica.html" target="_blank" rel="noopener">Ver inicio</a></div></header>
  <div class="appearance-layout"><aside><form id="themeForm">
    <fieldset><legend>Campaña</legend><label>Nombre<input name="name" maxlength="180"></label><label>Aviso superior<input name="announcement" maxlength="180"></label></fieldset>
    <fieldset><legend>Banner principal</legend><label>Encabezado<input name="kicker" maxlength="180"></label><label>Título<textarea name="title" maxlength="180" rows="2"></textarea></label><label>Descripción<textarea name="description" maxlength="500" rows="3"></textarea></label><label>Texto del botón<input name="button" maxlength="180"></label><label>Imagen del banner<input id="bannerFile" type="file" accept="image/png,image/jpeg,image/webp"></label><button type="button" id="removeBanner">Quitar imagen del banner</button><label>Posición de imagen<input name="imagePosition" type="range" min="0" max="100"></label><label>Alineación<select name="align"><option value="left">Izquierda</option><option value="center">Centro</option><option value="right">Derecha</option></select></label><div class="pair"><label>Altura<input name="heroHeight" type="number" min="200" max="600"></label><label>Tamaño del título<input name="fontSize" type="number" min="18" max="56"></label></div><div class="pair"><label>Fondo del banner<input name="heroBackground" type="color"></label><label>Texto del banner<input name="heroText" type="color"></label></div></fieldset>
    <fieldset><legend>Colores y logo</legend><div class="pair"><label>Botones<input name="accent" type="color"></label><label>Texto de botones<input name="buttonText" type="color"></label></div><div class="pair"><label>Fondo de página<input name="background" type="color"></label><label>Esquinas<input name="radius" type="number" min="0" max="40"></label></div><label>Logo de campaña<input id="logoFile" type="file" accept="image/png,image/jpeg,image/webp"></label><button type="button" id="removeLogo">Usar logo habitual</button></fieldset>
    <fieldset><legend>Catálogo</legend><label>Título de la sección<input name="catalogTitle" maxlength="180"></label></fieldset>
    <fieldset><legend>Orden de secciones</legend><select id="sectionSelect" aria-label="Sección"><option value="hero">Banner</option><option value="benefits">Beneficios</option><option value="catalog">Catálogo</option><option value="related">Sugerencias</option></select><div class="pair"><button id="moveUp" type="button" title="Mover sección arriba">↑ Arriba</button><button id="moveDown" type="button" title="Mover sección abajo">↓ Abajo</button></div><ol id="sectionOrder"></ol></fieldset>
    <fieldset><legend>Publicación</legend><button id="previous" type="button" disabled>Volver a la publicación anterior</button><button id="restore" type="button" disabled>Publicar diseño original</button></fieldset>
  </form><p id="themeStatus" role="status" aria-live="polite">Cargando configuración...</p></aside>
  <main><nav class="preview-toolbar"><div><button id="desktop" aria-pressed="true">Computadora</button><button id="mobile" aria-pressed="false">Celular</button></div><span id="publicationState">Vista previa</span></nav><div class="preview-workspace"><iframe id="homePreview" src="tienda_publica.html?appearancePreview=1" title="Vista previa del inicio"></iframe></div></main></div>
  <script src="js/apariencia_inicio.js?v=142"></script>
</body></html>
