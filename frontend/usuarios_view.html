<style>
  .usuarios-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 20px;
    margin-bottom: 22px;
  }

  .usuarios-header h2 {
    font-size: 30px;
    margin-bottom: 6px;
  }

  .usuarios-header p {
    color: #94a3b8;
    font-size: 14px;
  }

  .usuarios-contador {
    background: linear-gradient(135deg, #2563eb, #38bdf8);
    padding: 14px 18px;
    border-radius: 18px;
    font-weight: bold;
    box-shadow: 0 12px 30px rgba(37,99,235,.25);
    min-width: 150px;
    text-align: center;
  }

  .usuarios-contador span {
    display: block;
    font-size: 26px;
  }

  .filtros-usuarios {
    display: grid;
    grid-template-columns: 2fr 1fr auto;
    gap: 12px;
    margin: 22px 0;
    background: rgba(15, 23, 42, .65);
    padding: 16px;
    border-radius: 18px;
    border: 1px solid rgba(255,255,255,.08);
  }

  .filtros-usuarios input,
  .filtros-usuarios select,
  .filtros-usuarios button {
    padding: 12px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,.08);
    background: #334155;
    color: white;
    outline: none;
  }

  .filtros-usuarios input:focus,
  .filtros-usuarios select:focus {
    border-color: #38bdf8;
    box-shadow: 0 0 0 3px rgba(56,189,248,.15);
  }

  .filtros-usuarios button {
    background: #3b82f6;
    cursor: pointer;
    font-weight: bold;
    transition: .25s;
  }

  .filtros-usuarios button:hover {
    background: #2563eb;
    transform: translateY(-1px);
  }

  .tabla-wrapper {
    overflow-x: auto;
    border-radius: 18px;
    border: 1px solid rgba(255,255,255,.08);
    background: #0f172a;
  }

  .tabla-usuarios {
    width: 100%;
    border-collapse: collapse;
    min-width: 720px;
  }

  .tabla-usuarios thead {
    background: #020617;
  }

  .tabla-usuarios th {
    color: #38bdf8;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: .04em;
    padding: 15px;
    text-align: left;
    border-bottom: 1px solid #334155;
  }

  .tabla-usuarios td {
    padding: 15px;
    border-bottom: 1px solid rgba(255,255,255,.06);
    color: #e2e8f0;
    font-size: 14px;
  }

  .fila-usuario {
    transition: .25s;
  }

  .fila-usuario:hover {
    background: rgba(51, 65, 85, .65);
  }

  .usuario-nombre {
    font-weight: bold;
    color: white;
  }

  .usuario-email {
    color: #cbd5e1;
  }

  .rol-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: bold;
    white-space: nowrap;
  }

  .rol-admin {
    background: rgba(59, 130, 246, .18);
    color: #60a5fa;
    border: 1px solid rgba(59,130,246,.35);
  }

  .rol-cliente {
    background: rgba(22, 163, 74, .18);
    color: #4ade80;
    border: 1px solid rgba(22,163,74,.35);
  }

  .rol-empleado {
    background: rgba(245, 158, 11, .18);
    color: #fbbf24;
    border: 1px solid rgba(245,158,11,.35);
  }

  .sin-resultados {
    text-align: center;
    padding: 28px !important;
    color: #94a3b8 !important;
  }

  .usuarios-meta {
    color: #94a3b8;
    font-size: 13px;
    margin: 14px 0;
    text-align: right;
  }

  .paginacion-usuarios {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 14px;
    margin-top: 24px;
    flex-wrap: wrap;
  }

  .paginacion-usuarios button {
    width: auto;
    min-width: 120px;
    padding: 10px 16px;
    border: none;
    border-radius: 12px;
    background: #3b82f6;
    color: white;
    font-weight: bold;
    cursor: pointer;
  }

  .paginacion-usuarios button:disabled {
    opacity: .45;
    cursor: not-allowed;
    background: #475569;
  }

  .paginacion-usuarios span {
    color: #cbd5e1;
    font-weight: bold;
    background: rgba(15,23,42,.75);
    border: 1px solid rgba(255,255,255,.08);
    padding: 10px 14px;
    border-radius: 12px;
  }

  @media(max-width: 900px) {
    .usuarios-header {
      flex-direction: column;
    }

    .filtros-usuarios {
      grid-template-columns: 1fr;
    }

    .usuarios-meta {
      text-align: left;
    }
  }

  .sortable-th {
    cursor: pointer;
    user-select: none;
    position: relative;
    transition: .2s;
  }

  .sortable-th:hover {
    background: rgba(56,189,248,.12);
    color: #67e8f9;
  }

  .sortable-th .sort-icon {
    margin-left: 6px;
    color: #94a3b8;
    font-size: 11px;
  }

  .sortable-th.activo .sort-icon {
    color: #facc15;
  }

<section class="section">
  <div class="usuarios-header">
    <div>
      <h2>👥 Usuarios registrados</h2>
      <p>Consulta clientes, administradores y empleados registrados en el sistema.</p>
    </div>

    <div class="usuarios-contador">
      Usuarios
      <span id="contadorUsuarios">0</span>

  <div class="modern-filter-toolbar usuarios-filter-toolbar">
    <div class="search-box">

      <h3>Filtros de usuarios</h3>
      <button class="btn-modern-close" type="button" id="btnCerrarFiltrosUsuarios">×</button>
    </div>

    <label>Rol</label>
    <select id="filtroRolUsuario">
      <option value="">Todos los roles</option>

      <option value="cliente">Cliente</option>
      <option value="empleado">Empleado</option>

          <th class="sortable-th" data-sort="email">Email <span class="sort-icon">↕</span></th>
          <th class="sortable-th" data-sort="rol">Rol <span class="sort-icon">↕</span></th>

<script type="module">
  import axios from "https://cdn.jsdelivr.net/npm/axios@1.7.7/+esm";

  const API = "http://localhost:3000/api";
  const usuariosToken = localStorage.getItem("token");

  if (!usuariosToken) {
    window.location.href = "login-Panel.html";
  }

  const authHeaders = {
    headers: {
      Authorization: `Bearer ${usuariosToken}`
    }
  };

  let usuariosGlobales = [];
  let paginaActual = 1;
  const limiteUsuarios = 20;
  let busquedaActual = "";
  let rolActual = "";
  let totalUsuariosActual = 0;
  let totalPaginasActual = 1;
  let ordenCampoUsuarios = "";
  let ordenDireccionUsuarios = "asc";
  let destinoPendienteUsuariosProcesado = false;


  const buscarUsuario = document.getElementById("buscarUsuario");
  const filtroRolUsuario = document.getElementById("filtroRolUsuario");
  const limpiarFiltrosUsuarios = document.getElementById("limpiarFiltrosUsuarios");
  const contadorUsuarios = document.getElementById("contadorUsuarios");
  const infoUsuarios = document.getElementById("infoUsuarios");
  const paginacionUsuarios = document.getElementById("paginacionUsuarios");


function obtenerDestinoPendienteVista(vista, acciones = []) {
  let destino = window.TIENDAPRO_DESTINO_PENDIENTE || null;
  if (!destino) {
    try { destino = JSON.parse(localStorage.getItem('tiendapro_destino_pendiente') || 'null'); } catch { destino = null; }
  }
  if (!destino) return null;
  if (vista && destino.vista && destino.vista !== vista) return null;
  if (acciones.length && !acciones.includes(destino.accion)) return null;
  return destino;
}
function limpiarDestinoPendienteVista() {
  window.TIENDAPRO_DESTINO_PENDIENTE = null;
  try { localStorage.removeItem('tiendapro_destino_pendiente'); } catch {}
}
function resaltarRegistroPendiente(selector) {
  const el = document.querySelector(selector);
  if (!el) return;
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  el.style.outline = '2px solid #38bdf8';
  el.style.boxShadow = '0 0 0 6px rgba(56,189,248,.16)';
  setTimeout(() => { el.style.outline = ''; el.style.boxShadow = ''; }, 2400);
}

  function verDetalleUsuario(id) {
    const usuario = usuariosGlobales.find(u => Number(u.id) === Number(id));
    if (!usuario) return;
    const detalleHtml = `
      <div style="text-align:left;background:#0f172a;border:1px solid rgba(148,163,184,.22);border-radius:16px;padding:16px;color:#e2e8f0">
        <p><b>ID:</b> #${usuario.id}</p>
        <p><b>Nombre:</b> ${usuario.nombre || 'Sin nombre'}</p>
        <p><b>Email:</b> ${usuario.email || 'Sin email'}</p>
        <p><b>Rol:</b> ${usuario.rol || 'cliente'}</p>
        <p><b>Fecha registro:</b> ${formatearFecha(usuario.fecha_registro)}</p>
      </div>
    `;

    if (window.Swal) {
      Swal.fire({
        title: usuario.nombre || 'Usuario',
        html: detalleHtml,
        confirmButtonText: 'Cerrar',
        background: '#1e293b',
        color: 'white'
      });
    } else {
      alert(`Usuario: ${usuario.nombre || 'Sin nombre'}
Email: ${usuario.email || 'Sin email'}
Rol: ${usuario.rol || 'cliente'}`);
    }
  }
  window.verDetalleUsuario = verDetalleUsuario;

  async function procesarDestinoPendienteUsuarios() {
    if (destinoPendienteUsuariosProcesado) return;
    let destino = obtenerDestinoPendienteVista(null, ['abrirCliente','abrirEmpleado','abrirAdministrador','abrirUsuarioVendedor','abrirUsuario','filtrarRegistro']);
    if (!destino) return;
    const vistasUsuarios = ['usuarios_view.html','clientes_view.html','empleados_view.html','administradores_view.html','usuarios_vendedores_view.html'];
    if (destino.vista && !vistasUsuarios.includes(destino.vista)) return;
    destinoPendienteUsuariosProcesado = true;
    const registro = String(destino.registro || destino.idVisible || '').trim();
    const soloFiltrarDestino = destino.soloFiltrar === true || destino.abrirDetalle === false || destino.accion === 'filtrarRegistro';
    if (!registro) return limpiarDestinoPendienteVista();
    let usuario = usuariosGlobales.find(u => String(u.id) === registro || normalizarTexto(u.nombre || '') === normalizarTexto(registro) || String(u.email || '') === registro);
    if (!usuario) {
      try {
        busquedaActual = registro;
        if (buscarUsuario) buscarUsuario.value = registro;
        paginaActual = 1;
        const params = new URLSearchParams({ page: 1, limit: limiteUsuarios, search: registro, rol: rolActual });
        const res = await axios.get(`${API}/usuarios?${params.toString()}`, authHeaders);
        usuariosGlobales = Array.isArray(res.data.usuarios) ? res.data.usuarios : [];
        totalUsuariosActual = Number(res.data.total || usuariosGlobales.length);
        totalPaginasActual = Number(res.data.totalPaginas || 1);
        mostrarUsuarios(usuariosGlobales);
        renderizarPaginacion();
        usuario = usuariosGlobales.find(u => String(u.id) === registro || normalizarTexto(u.nombre || '') === normalizarTexto(registro) || String(u.email || '') === registro) || usuariosGlobales[0];
      } catch (error) { console.error('No se pudo preparar el usuario buscado:', error); }
    }
    if (usuario) {
      limpiarDestinoPendienteVista();
      setTimeout(() => { resaltarRegistroPendiente(`[data-usuario-id="${usuario.id}"]`); if (!soloFiltrarDestino) verDetalleUsuario(usuario.id); }, 260);
    } else limpiarDestinoPendienteVista();
  }

  function normalizarTexto(texto) {
    return (texto || "")
      .toString()
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .trim();
  }

  function formatearFecha(fecha) {
    if (!fecha) return "Sin fecha";
    return fecha.toString().replace("T", " ").slice(0, 19);
  }

  function claseRol(rol) {
    const r = normalizarTexto(rol);
    if (r === "admin") return "rol-admin";
    if (r === "empleado") return "rol-empleado";
    return "rol-cliente";
  }

  function iconoRol(rol) {
    const r = normalizarTexto(rol);
    if (r === "admin") return "🛡️";
    if (r === "empleado") return "🧰";
    return "🛒";
  }

  function valorOrdenUsuario(usuario, campo) {
    if (campo === "id") return Number(usuario.id || 0);
    if (campo === "fecha_registro") return new Date(usuario.fecha_registro || 0).getTime();
    return normalizarTexto(usuario[campo] || "");
  }

  function ordenarUsuariosLista(usuarios) {
    if (!ordenCampoUsuarios) return [...usuarios];

    return [...usuarios].sort((a, b) => {
      const va = valorOrdenUsuario(a, ordenCampoUsuarios);
      const vb = valorOrdenUsuario(b, ordenCampoUsuarios);

      if (typeof va === "number" && typeof vb === "number") {
        return ordenDireccionUsuarios === "asc" ? va - vb : vb - va;
      }

      return ordenDireccionUsuarios === "asc"
        ? String(va).localeCompare(String(vb), "es")
        : String(vb).localeCompare(String(va), "es");
    });
  }

  function actualizarIconosOrdenUsuarios() {
    document.querySelectorAll(".tabla-usuarios .sortable-th").forEach(th => {
      const icon = th.querySelector(".sort-icon");
      const activo = th.dataset.sort === ordenCampoUsuarios;
      th.classList.toggle("activo", activo);
      if (icon) icon.textContent = activo ? (ordenDireccionUsuarios === "asc" ? "▲" : "▼") : "↕";
    });
  }

  document.querySelectorAll(".tabla-usuarios .sortable-th").forEach(th => {
    th.addEventListener("click", () => {
      const campo = th.dataset.sort;
      if (ordenCampoUsuarios === campo) {
        ordenDireccionUsuarios = ordenDireccionUsuarios === "asc" ? "desc" : "asc";
      } else {
        ordenCampoUsuarios = campo;
        ordenDireccionUsuarios = campo === "id" || campo === "fecha_registro" ? "desc" : "asc";
      }
      mostrarUsuarios(usuariosGlobales);
    });
  });

  async function cargarUsuarios() {
    try {
      const params = new URLSearchParams({
        page: paginaActual,
        limit: limiteUsuarios,
        search: busquedaActual,
        rol: rolActual
      });

      const res = await axios.get(`${API}/usuarios?${params.toString()}`, authHeaders);

      usuariosGlobales = Array.isArray(res.data.usuarios) ? res.data.usuarios : [];
      totalUsuariosActual = Number(res.data.total || 0);
      totalPaginasActual = Number(res.data.totalPaginas || 1);

      mostrarUsuarios(usuariosGlobales);
      renderizarPaginacion();
      procesarDestinoPendienteUsuarios();

    } catch (error) {
      console.error("Error cargando usuarios:", error);
      usuariosGlobales = [];
      mostrarUsuarios([]);
    }
  }

  function mostrarUsuarios(usuarios) {
    const tabla = document.getElementById("tablaUsuarios");

    contadorUsuarios.innerText = totalUsuariosActual;
    tabla.innerHTML = "";

    if (usuarios.length === 0) {
      tabla.innerHTML = `
        <tr>
          <td colspan="5" class="sin-resultados">
            No hay usuarios que coincidan con los filtros
          </td>
        </tr>
      `;
      return;
    }

    const usuariosOrdenados = ordenarUsuariosLista(usuarios);
    actualizarIconosOrdenUsuarios();

    usuariosOrdenados.forEach(usuario => {
      tabla.innerHTML += `
        <tr class="fila-usuario" data-usuario-id="${usuario.id}" onclick="verDetalleUsuario(${usuario.id})">
          <td data-label="ID">#${usuario.id}</td>
          <td data-label="Nombre" class="usuario-nombre">${usuario.nombre || "Sin nombre"}</td>
          <td data-label="Email" class="usuario-email">${usuario.email || "Sin email"}</td>
          <td data-label="Rol">
            <span class="rol-badge ${claseRol(usuario.rol)}">
              ${iconoRol(usuario.rol)} ${usuario.rol || "cliente"}
            </span>
          </td>
          <td data-label="Fecha registro">${formatearFecha(usuario.fecha_registro)}</td>
        </tr>
      `;
    });
  }

  function renderizarPaginacion() {
    const inicio = totalUsuariosActual === 0 ? 0 : ((paginaActual - 1) * limiteUsuarios) + 1;
    const fin = Math.min(paginaActual * limiteUsuarios, totalUsuariosActual);

    infoUsuarios.innerText = `Mostrando ${inicio}-${fin} de ${totalUsuariosActual} usuarios`;

    if (totalPaginasActual <= 1) {
      paginacionUsuarios.innerHTML = "";
      return;
    }

    paginacionUsuarios.innerHTML = `
      <button ${paginaActual <= 1 ? "disabled" : ""} onclick="cambiarPaginaUsuarios(${paginaActual - 1})">
        ← Anterior
      </button>

      <span>Página ${paginaActual} de ${totalPaginasActual}</span>

      <button ${paginaActual >= totalPaginasActual ? "disabled" : ""} onclick="cambiarPaginaUsuarios(${paginaActual + 1})">
        Siguiente →
      </button>
    `;
  }

  window.cambiarPaginaUsuarios = function(nuevaPagina) {
    if (nuevaPagina < 1 || nuevaPagina > totalPaginasActual) return;

    paginaActual = nuevaPagina;
    cargarUsuarios();
  };

  let temporizadorBusqueda = null;

  buscarUsuario.addEventListener("input", () => {
    clearTimeout(temporizadorBusqueda);

    temporizadorBusqueda = setTimeout(() => {
      busquedaActual = buscarUsuario.value.trim();
      paginaActual = 1;
      cargarUsuarios();
    }, 350);
  });

  filtroRolUsuario.addEventListener("change", () => {
    rolActual = filtroRolUsuario.value;
    paginaActual = 1;
    cargarUsuarios();
  });

  limpiarFiltrosUsuarios.addEventListener("click", () => {
    buscarUsuario.value = "";
    filtroRolUsuario.value = "";

    busquedaActual = "";
    rolActual = "";
    paginaActual = 1;

    cerrarFiltrosUsuarios();
    cargarUsuarios();
  });

  function abrirFiltrosUsuarios() {
    filtrosUsuariosOverlay.classList.add("activo");
    filtrosUsuariosPanel.classList.add("abierto");
  }

  function cerrarFiltrosUsuarios() {
    filtrosUsuariosOverlay.classList.remove("activo");
    filtrosUsuariosPanel.classList.remove("abierto");
  }

  btnAbrirFiltrosUsuarios.addEventListener("click", abrirFiltrosUsuarios);
  btnCerrarFiltrosUsuarios.addEventListener("click", cerrarFiltrosUsuarios);
  filtrosUsuariosOverlay.addEventListener("click", cerrarFiltrosUsuarios);
  btnAplicarFiltrosUsuarios.addEventListener("click", () => {
    rolActual = filtroRolUsuario.value;
    paginaActual = 1;
    cerrarFiltrosUsuarios();
    cargarUsuarios();
  });

  cargarUsuarios();
</script>
